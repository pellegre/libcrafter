[package]
name = "crafter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "src/lib.rs"

# The whad feature gates the optional dongle backend (protobuf + serial)
# so the default build remains free of those dependencies.
[features]
default = []
radio = ["dep:wide"]
radio-hackrf = ["radio"]
whad = ["dep:prost", "dep:prost-build", "dep:serialport"]

[dependencies]
aes = "0.8"
aes-gcm = "0.11"
cbc = "0.1"
ccm = "0.5"
chacha20 = "0.10"
chacha20poly1305 = "0.11"
cipher = "0.4"
ctr = "0.9"
hmac = "0.12"
md-5 = "0.10"
pcap = "2.4.0"
pbkdf2 = "0.12"
pnet_datalink = "0.35.0"
pnet_packet = "0.35.0"
pnet_transport = "0.35.0"
prost = { version = "0.13", optional = true }
serialport = { version = "4.9.0", default-features = false, optional = true }
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
wide = { version = "1.7.0", optional = true, default-features = false }

[build-dependencies]
prost-build = { version = "0.14", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
proptest = "1"

[[example]]
name = "radio_receive"
required-features = ["radio"]

[[example]]
name = "wifi_interface"
required-features = ["radio"]

[[example]]
name = "radio_compare"
required-features = ["radio"]

[[example]]
name = "radio_transmit"
required-features = ["radio"]
