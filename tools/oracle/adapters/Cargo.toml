[package]
name = "oracle-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "oracle_decode_vectors"
path = "src/bin/oracle_decode_vectors.rs"

[[bin]]
name = "oracle_live_endpoint"
path = "src/bin/oracle_live_endpoint.rs"

[[bin]]
name = "oracle_materialize_plans"
path = "src/bin/oracle_materialize_plans.rs"

[[bin]]
name = "oracle_pcap"
path = "src/bin/oracle_pcap.rs"

[[bin]]
name = "oracle_vectors"
path = "src/bin/oracle_vectors.rs"

[dependencies]
crafter = { path = "../../../crates/crafter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
