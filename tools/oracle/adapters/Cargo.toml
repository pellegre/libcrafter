[package]
name = "oracle-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "decode_vectors"
path = "src/bin/decode_vectors.rs"

[[bin]]
name = "ipsec_interop"
path = "src/bin/ipsec_interop.rs"

[[bin]]
name = "live_endpoint"
path = "src/bin/live_endpoint.rs"

[[bin]]
name = "materialize_plans"
path = "src/bin/materialize_plans.rs"

[[bin]]
name = "pcap"
path = "src/bin/pcap.rs"

[[bin]]
name = "vectors"
path = "src/bin/vectors.rs"

[dependencies]
crafter = { path = "../../../crafter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
