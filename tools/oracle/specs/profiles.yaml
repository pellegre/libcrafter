version: 1
kind: profiles
name: oracle_initial_profiles
description: Seeded sampling profiles for offline, pcap, and live oracle runs.

profiles:
  - name: smoke
    purpose: tiny stable local and PR sanity coverage
    default_count: 10
    family_weights:
      - name: ipv4
        weight: 4
      - name: ipv6
        weight: 1
      - name: udp
        weight: 1
    payload_length:
      min: 0
      max: 32
    feature_weights:
      baseline: 10
      boundary: 1
      malformed: 0
      pcap: 0
      live: 0
  - name: ci
    purpose: deterministic pull request coverage
    default_count: 2000
    family_weights:
      - name: ipv4
        weight: 3
      - name: ipv6
        weight: 2
      - name: udp
        weight: 2
    payload_length:
      min: 0
      max: 256
    feature_weights:
      baseline: 10
      boundary: 3
      malformed: 1
      pcap: 1
      live: 0
  - name: wild
    purpose: common packet shapes and field values
    default_count: 5000
    family_weights:
      - name: ipv4
        weight: 3
      - name: ipv6
        weight: 2
      - name: udp
        weight: 2
    payload_length:
      min: 0
      max: 512
    feature_weights:
      baseline: 10
      boundary: 2
      malformed: 1
      pcap: 1
      live: 1
  - name: boundary
    purpose: edge values, options, checksums, lengths, and header limits
    default_count: 1000
    family_weights:
      - name: ipv4
        weight: 1
      - name: ipv6
        weight: 1
      - name: udp
        weight: 2
    payload_length:
      min: 0
      max: 1500
    feature_weights:
      baseline: 3
      boundary: 10
      malformed: 2
      pcap: 1
      live: 0
  - name: fuzz
    purpose: valid-weird and explicitly malformed behavior
    default_count: 1000
    family_weights:
      - name: ipv4
        weight: 1
      - name: ipv6
        weight: 1
      - name: udp
        weight: 2
    payload_length:
      min: 0
      max: 128
    feature_weights:
      baseline: 2
      boundary: 4
      malformed: 8
      pcap: 1
      live: 0
  # tcp-header: focused offline coverage of TCP header compile/decode behavior.
  # The generator narrows stack/case/feature selection to the tcp_header feature
  # when this profile is active (see tools/oracle/engine/generator.py), so a run
  # such as `offline --profile tcp-header --seed 1 --count 10` deterministically
  # samples only the TCP header cases: SYN, SYN-ACK, RST-ACK, payload ACK, IPv4
  # and IPv6 checksum contexts, an explicit checksum override, an invalid data
  # offset, and raw payload preservation. The ipv4/ipv6 weights keep both TCP
  # stacks eligible; baseline/boundary/malformed keep the typed and edge cases
  # sampled deterministically for a given seed.
  - name: tcp-header
    purpose: focused offline TCP header compile and decode behavior
    default_count: 10
    family_weights:
      - name: ipv4
        weight: 2
      - name: ipv6
        weight: 1
    payload_length:
      min: 0
      max: 16
    feature_weights:
      baseline: 10
      boundary: 6
      malformed: 4
      pcap: 0
      live: 0
  # tcp-options: focused offline coverage of TCP option encode/decode behavior.
  # The generator narrows stack/case/feature selection to the tcp_options feature
  # when this profile is active (see tools/oracle/engine/generator.py), so a run
  # such as `offline --profile tcp-options --seed 1 --count 10` deterministically
  # samples only the TCP option cases declared in
  # tools/oracle/specs/features/tcp-options.yaml. The comparable option kinds
  # (MSS, Window Scale, SACK Permitted, SACK, Timestamp, Fast Open, MPTCP
  # generic, and an unknown valid generic option) compile to byte-identical
  # option regions across both backends and are compared octet-for-octet. The
  # preserved-only kinds (User Timeout, TCP-AO, TCP-ENO, Accurate ECN,
  # experimental ExID) and the malformed-option-length case carry
  # byte_policy: structured_error: the Scapy reference backend has no faithful
  # offline build/compare path for them, so they stay declared coverage but are
  # excluded from offline encode/decode sampling. The crate's own unit,
  # resilience, and fixture suites assert their preservation and typed errors.
  - name: tcp-options
    purpose: focused offline TCP option compile and decode behavior
    default_count: 10
    family_weights:
      - name: ipv4
        weight: 2
      - name: ipv6
        weight: 1
    payload_length:
      min: 0
      max: 16
    feature_weights:
      baseline: 10
      boundary: 6
      malformed: 4
      pcap: 0
      live: 0
  # tcp-smoke: representative TCP smoke set for provider-backed dry-run
  # validation. It is the TCP analogue of the focused tcp-header / tcp-options
  # profiles, but it deliberately keeps BOTH the tcp_header and tcp_options
  # features eligible so a single small run materializes a representative mix of
  # TCP header and TCP option cases (see the tcp-smoke branches in
  # tools/oracle/engine/generator.py). It exists so that
  # `tools/oracle/run live --provider <p> --dry-run --profile tcp-smoke` can
  # materialize a TCP packet plan WITHOUT any live traffic or credentials: the
  # dry-run path only validates the orchestration plan and provider contract.
  # The ipv4/ipv6 weights keep both TCP stacks eligible; baseline/boundary keep
  # the typed cases sampled deterministically for a given seed.
  - name: tcp-smoke
    purpose: representative TCP smoke set for provider-backed dry-run validation
    default_count: 10
    family_weights:
      - name: ipv4
        weight: 2
      - name: ipv6
        weight: 1
    payload_length:
      min: 0
      max: 16
    feature_weights:
      baseline: 10
      boundary: 6
      malformed: 0
      pcap: 0
      live: 0
  # ipv4-enrichment: focused offline coverage of the enriched IPv4 header
  # domains declared in layers/ipv4.yaml. The generator narrows stack/case and
  # feature selection to that layer's coverage cases when this profile is active,
  # so a run such as `offline --profile ipv4-enrichment --seed 1 --count 12
  # --root l3:ipv4` stays on data-driven IPv4 header behavior: DS field
  # boundary values, unknown protocol Raw payload fallback, MF+offset fragments,
  # TTL 255, and supported option encodings. Malformed and live behavior remain
  # out of scope for this offline dry-run profile.
  - name: ipv4-enrichment
    purpose: focused offline IPv4 header enrichment behavior
    default_count: 12
    family_weights:
      - name: ipv4
        weight: 1
    payload_length:
      min: 0
      max: 32
    feature_weights:
      baseline: 10
      boundary: 10
      malformed: 0
      pcap: 0
      live: 0
  # ipv6-enrichment: focused offline coverage for enriched IPv6 base and
  # extension-header decode/compile behavior. The generator narrows stack and
  # case selection to the IPv6 base/unknown-next-header cases plus the currently
  # strict-byte comparable Hop-by-Hop, Destination Options, fragment, routing,
  # SRH, TCP-chain, and ICMPv6-chain cases. Malformed extension chains carry
  # byte_policy: structured_error and are therefore explicit
  # pcap/wire-ineligible cases rather than sampled offline.
  - name: ipv6-enrichment
    purpose: focused offline IPv6 base and extension-header enrichment coverage
    default_count: 20
    family_weights:
      - name: ipv6
        weight: 6
      - name: udp
        weight: 2
    payload_length:
      min: 0
      max: 32
    feature_weights:
      baseline: 10
      boundary: 8
      malformed: 1
      pcap: 0
      live: 0
  # fragmentation-smoke: focused classic pcap dry-run planning for IP fragment
  # coverage. It accepts the aggregate `ip` family filter used by transform
  # validation commands and narrows generation to existing IPv4/IPv6 fragment
  # coverage cases without live traffic.
  - name: fragmentation-smoke
    purpose: focused offline pcap planning for IP fragment coverage
    default_count: 10
    family_weights:
      - name: ip
        weight: 1
    payload_length:
      min: 16
      max: 96
    feature_weights:
      baseline: 1
      boundary: 6
      malformed: 0
      pcap: 0
      live: 0
  # ip-fragment-smoke: provider-backed dry-run planning for IP fragment lab
  # behavior. It samples the same strict-byte packet fragment shapes as the
  # offline fragmentation profile, while the oracle live dry-run report adds the
  # provider-neutral workload plan for small MTU setup, offload handling,
  # oversized/crafted fragment traffic, pcap capture, and payload hash checks.
  - name: ip-fragment-smoke
    purpose: provider-neutral IP fragment lab workload dry-run planning
    default_count: 10
    family_weights:
      - name: ip
        weight: 1
    payload_length:
      min: 16
      max: 96
    feature_weights:
      baseline: 1
      boundary: 6
      malformed: 0
      pcap: 0
      live: 0
  # dot11-smoke: focused offline IEEE 802.11 MAC smoke coverage. This profile
  # keeps live weight at zero; monitor-mode dongle injection is manual and can
  # only be represented by later dry-run send-plan validation.
  - name: dot11-smoke
    purpose: focused offline IEEE 802.11 MAC frame smoke coverage
    default_count: 10
    family_weights:
      - name: dot11
        weight: 3
      - name: radiotap
        weight: 1
    payload_length:
      min: 0
      max: 64
    feature_weights:
      baseline: 10
      boundary: 4
      malformed: 1
      pcap: 0
      live: 0
  # radiotap-smoke: focused offline radiotap wrapper coverage, including
  # present-bit metadata and FCS status preservation. It is dry-run eligible
  # only; automated oracle runs must not require monitor mode or hardware.
  - name: radiotap-smoke
    purpose: focused offline radiotap and IEEE 802.11 wrapper smoke coverage
    default_count: 10
    family_weights:
      - name: radiotap
        weight: 4
      - name: dot11
        weight: 1
    payload_length:
      min: 0
      max: 64
    feature_weights:
      baseline: 10
      boundary: 5
      malformed: 1
      pcap: 0
      live: 0
  # dot11-pcap: focused classic pcap coverage for bare IEEE 802.11 and
  # radiotap-wrapped IEEE 802.11 link types. The pcap dimension is explicit,
  # while live remains zero so no send path is exercised by this profile.
  - name: dot11-pcap
    purpose: focused classic pcap link-type coverage for IEEE 802.11 and radiotap
    default_count: 8
    family_weights:
      - name: dot11
        weight: 1
      - name: radiotap
        weight: 1
    payload_length:
      min: 0
      max: 64
    feature_weights:
      baseline: 2
      boundary: 1
      malformed: 0
      pcap: 10
      live: 0
  # eapol-smoke: focused offline EAPOL and RSN EAPOL-Key foundation coverage
  # carried through explicit LLC/SNAP. It remains dry-run eligible only because
  # phase 1.5 does not include handshake capture automation.
  - name: eapol-smoke
    purpose: focused offline EAPOL and RSN EAPOL-Key foundation coverage
    default_count: 10
    family_weights:
      - name: eapol
        weight: 4
      - name: llc_snap
        weight: 1
    payload_length:
      min: 0
      max: 128
    feature_weights:
      baseline: 10
      boundary: 4
      malformed: 1
      pcap: 0
      live: 0
  # rsn-smoke: focused offline RSN information element coverage for management
  # metadata and EAPOL key-data boundaries. Decryption and live handshake
  # workflows remain out of scope; live sampling is disabled.
  - name: rsn-smoke
    purpose: focused offline RSN information element and key-data metadata coverage
    default_count: 10
    family_weights:
      - name: rsn
        weight: 4
      - name: eapol
        weight: 1
    payload_length:
      min: 0
      max: 128
    feature_weights:
      baseline: 10
      boundary: 4
      malformed: 1
      pcap: 0
      live: 0

backend_support:
  scapy:
    status: supported
    notes:
      - Profiles affect generator sampling only.
  libcrafter:
    status: supported
    notes:
      - Profiles affect generator sampling only.
