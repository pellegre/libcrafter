version: 1
kind: stack_grammar
name: oracle_initial_stacks
description: Initial backend-neutral stacks translated from oracle case specs.

roots:
  - name: "link:raw"
    layers:
      - payload
    families:
      - link
  - name: "link:ethernet"
    layers:
      - ethernet
    families:
      - link
      - arp
      - ipv4
      - ipv6
      - udp
      - dns
      - dhcp
  - name: "link:linux-cooked"
    layers:
      - linux_cooked
    families:
      - link
      - arp
      - ipv4
      - udp
  - name: "link:null-loopback"
    layers:
      - null_loopback
    families:
      - link
      - ipv4
      - ipv6
      - udp
  - name: "link:dot11"
    layers:
      - dot11
    families:
      - link
      - dot11
      - llc_snap
      - eapol
      - rsn
  - name: "link:radiotap"
    layers:
      - radiotap
    families:
      - link
      - radiotap
      - dot11
      - llc_snap
      - arp
      - ipv4
      - ipv6
      - eapol
      - rsn
  - name: "l3:ipv4"
    layers:
      - ipv4
    families:
      - ipv4
      - udp
      - transport
      - icmp
      - dns
      - esp
      - ah
      - ikev2
  - name: "l2:ipv4"
    layers:
      - ipv4
    families:
      - ipv4
      - transport
      - icmp
      - dns
  - name: "l3:ipv6"
    layers:
      - ipv6
    families:
      - ipv6
      - udp
      - transport
      - icmp
      - esp
      - ah
      - ikev2

families:
  - name: ipv4
    default_stack:
      - ethernet
      - ipv4
      - udp
      - payload
    feature_tags:
      - ethernet
      - ipv4
      - udp
      - payload
  - name: ipv6
    default_stack:
      - ethernet
      - ipv6
      - udp
      - payload
    feature_tags:
      - ethernet
      - ipv6
      - udp
      - payload
  - name: ip
    default_stack:
      - ipv4
      - payload
    feature_tags:
      - ip
      - ipv4
      - ipv6
      - payload
  - name: udp
    default_stack:
      - ipv4
      - udp
      - payload
    feature_tags:
      - udp
      - payload
  # esp / ah / ikev2: IPSec families. ESP and AH ride directly over IPv4 and
  # IPv6 (IP protocol 50 / 51); IKEv2 rides over UDP (UDP/500, and UDP/4500
  # after the non-ESP marker). These families let the deterministic generator
  # sample the IPSec stacks declared below while keeping ESP/AH/IKEv2 offline
  # and dry-run only (documentation address space, pinned keys/IV/SPI).
  - name: esp
    default_stack:
      - ipv4
      - esp
      - payload
    feature_tags:
      - ipv4
      - esp
      - payload
  - name: ah
    default_stack:
      - ipv4
      - ah
      - tcp
      - payload
    feature_tags:
      - ipv4
      - ah
      - tcp
      - payload
  - name: ikev2
    default_stack:
      - ipv4
      - udp
      - ikev2
      - payload
    feature_tags:
      - ipv4
      - udp
      - ikev2
      - payload
  - name: dot11
    default_stack:
      - dot11
      - payload
    feature_tags:
      - dot11
      - payload
  - name: radiotap
    default_stack:
      - radiotap
      - dot11
      - payload
    feature_tags:
      - radiotap
      - dot11
      - payload
  - name: llc_snap
    default_stack:
      - radiotap
      - dot11
      - llc_snap
      - payload
    feature_tags:
      - radiotap
      - dot11
      - llc_snap
      - payload
  - name: eapol
    default_stack:
      - radiotap
      - dot11
      - llc_snap
      - eapol
      - payload
    feature_tags:
      - radiotap
      - dot11
      - llc_snap
      - eapol
      - payload
  - name: rsn
    default_stack:
      - radiotap
      - dot11
      - rsn
    feature_tags:
      - radiotap
      - dot11
      - rsn

stacks:
  - name: ethernet_payload
    root: "link:ethernet"
    layers:
      - ethernet
      - payload
    coverage_cases:
      - ethernet
      - crafter-ethernet-unknown-ethertype
  - name: raw_payload
    root: "link:raw"
    layers:
      - payload
    coverage_cases:
      - raw-payload-link
      - crafter-raw-payload
  # dot11 / payload: bare IEEE 802.11 MAC frames for pcap fixtures and
  # offline decode/round-trip coverage. Live traffic is intentionally absent
  # from this root; monitor-mode injection is represented by the radiotap root
  # and remains dry-run/manual until a dongle-backed validation path exists.
  - name: dot11_payload
    root: "link:dot11"
    layers:
      - dot11
      - payload
    coverage_cases:
      - dot11-data-basic
      - dot11-qos-data
      - dot11-protected-raw
      - dot11-management-basic
      - dot11-control-basic
      - dot11-unknown-subtype-raw
      - pcap-scapy-dot11
      - pcap-crafter-dot11
      - pcap-dot11-protected-raw
      - crafter-dot11-roundtrip
  # radiotap / dot11: monitor-mode metadata wrapped around an IEEE 802.11 MAC
  # frame. Automated oracle profiles keep this offline/dry-run only; live
  # injection requires explicit manual dongle validation in a later step.
  - name: radiotap_dot11_payload
    root: "link:radiotap"
    layers:
      - radiotap
      - dot11
      - payload
    coverage_cases:
      - radiotap-basic
      - radiotap-flags-rate-channel
      - radiotap-fcs-metadata
      - pcap-scapy-radiotap
      - pcap-crafter-radiotap
      - pcap-dot11-protected-raw
      - crafter-radiotap-roundtrip
  - name: radiotap_dot11_llc_snap_ipv4
    root: "link:radiotap"
    layers:
      - radiotap
      - dot11
      - llc_snap
      - ipv4
    coverage_cases:
      - llc-snap-ipv4
  - name: radiotap_dot11_llc_snap_ipv6
    root: "link:radiotap"
    layers:
      - radiotap
      - dot11
      - llc_snap
      - ipv6
    coverage_cases:
      - llc-snap-ipv6
  - name: radiotap_dot11_llc_snap_arp
    root: "link:radiotap"
    layers:
      - radiotap
      - dot11
      - llc_snap
      - arp
    coverage_cases:
      - llc-snap-arp
  - name: radiotap_dot11_llc_snap_eapol
    root: "link:radiotap"
    layers:
      - radiotap
      - dot11
      - llc_snap
      - eapol
      - payload
    coverage_cases:
      - llc-snap-eapol
      - eapol-start
      - eapol-key-rsn
      - eapol-key-data-rsn
      - crafter-eapol-roundtrip
  - name: radiotap_dot11_rsn
    root: "link:radiotap"
    layers:
      - radiotap
      - dot11
      - rsn
    coverage_cases:
      - dot11-management-rsn
      - rsn-minimal
      - rsn-psk-ccmp
      - rsn-sae-management-protection
      - crafter-rsn-roundtrip
  # ethernet / arp: ARP over Ethernet. ARP is IPv4-era link-layer address
  # resolution (target/arp-rfc/scope.md: RFC 826 over media-generic
  # HRD/PRO/HLN/PLN), so it stays rooted at a link layer and is never eligible
  # for network-layer host raw sends. Offline byte-equivalence, pcap, link-type,
  # and decode-root coverage run locally; live validation is L2-gated
  # (requires_l2 / requires_broadcast / requires_provider_mac in
  # tools/oracle/engine/corpus.py, keyed off the arp layer) and runs only
  # through provider-backed QEMU/VirtualBox lab sessions, never a privileged raw
  # send from the developer host.
  - name: ethernet_arp
    root: "link:ethernet"
    layers:
      - ethernet
      - arp
    coverage_cases:
      - arp-request
      - arp-reply
      - crafter-arp-reply
  # linux_cooked / arp: ARP captured/replayed over Linux cooked capture
  # (DLT_LINUX_SLL). The crafter crate already ships a LinuxSll/ARP fixture and
  # pcap round trip (pcaps/linux-sll-arp-who-has.pcap), so ARP must select this
  # supported link root in addition to Ethernet. It carries the same L2/live
  # constraints as ethernet_arp (the arp layer drives requires_l2 /
  # requires_broadcast / requires_provider_mac) and is offline/pcap-focused;
  # live ARP exchange remains a provider-backed QEMU/VirtualBox lab path.
  - name: linux_cooked_arp
    root: "link:linux-cooked"
    layers:
      - linux_cooked
      - arp
    coverage_cases:
      - arp-request
      - arp-reply
      - crafter-arp-reply
  - name: linux_cooked_ipv4_udp
    root: "link:linux-cooked"
    layers:
      - linux_cooked
      - ipv4
      - udp
      - payload
    coverage_cases:
      - linux-cooked-ipv4-udp
      - crafter-linux-cooked-ipv4-udp
  - name: null_loopback_ipv4_udp
    root: "link:null-loopback"
    layers:
      - null_loopback
      - ipv4
      - udp
      - payload
    coverage_cases:
      - null-loopback-ipv4-little-endian
  - name: vlan_ipv4_udp
    root: "link:ethernet"
    layers:
      - ethernet
      - vlan
      - ipv4
      - udp
      - payload
    coverage_cases:
      - vlan-ipv4-udp
      - vlan-boundary-fields
      - crafter-vlan-boundary-fields
  # ipv4 / payload: offline-only IPv4 header enrichment coverage where the
  # protocol field intentionally falls back to Raw payload. The focused
  # ipv4-enrichment profile samples these cases without involving live traffic.
  - name: ipv4_payload
    root: "l3:ipv4"
    layers:
      - ipv4
      - payload
    coverage_cases:
      - ipv4-boundary-fields
      - ipv4-unknown-protocol-raw
      - ipv4-fragment-mf-offset
      - ipv4-ttl-255
      - ipv4-options
      - ipv4-options-source-route-traceroute
      - crafter-ipv4-boundary-fields
      - crafter-ipv4-unknown-protocol-raw
      - crafter-ipv4-fragment-mf-offset
      - crafter-ipv4-ttl-255
      - crafter-ipv4-options
      - crafter-ipv4-source-route-traceroute
  - name: ipv4_udp_payload
    root: "l3:ipv4"
    layers:
      - ipv4
      - udp
      - payload
    coverage_cases:
      - ipv4-udp
      - udp-ipv4-zero-checksum
      - udp-options-known
      - udp-options-ocs
      - udp-options-apc
      - udp-options-unknown-safe
      - udp-options-unknown-unsafe
      - udp-options-unsupported-frag
      - udp-options-surplus-application-boundary
  - name: ipv4_tcp_payload
    root: "l3:ipv4"
    layers:
      - ipv4
      - tcp
      - payload
    coverage_cases:
      - ipv4-tcp-syn
      - tcp-all-flags-reserved-offset
      - tcp-options
      - tcp-options-sack-blocks
      - tcp-options-mptcp-fastopen-edo-generic
      - tcp-header-syn
      - tcp-header-syn-ack
      - tcp-header-rst-ack
      - tcp-header-payload-ack
      - tcp-header-ipv4-checksum
      - tcp-header-explicit-checksum
      - tcp-header-raw-payload
      - tcp-header-invalid-data-offset
      # Focused single-option cases (tcp-options profile). The comparable kinds
      # compare octet-for-octet; the structured_error kinds are declared
      # coverage excluded from offline sampling.
      - tcp-option-mss
      - tcp-option-window-scale
      - tcp-option-sack-permitted
      - tcp-option-sack
      - tcp-option-timestamp
      - tcp-option-fast-open
      - tcp-option-mptcp-generic
      - tcp-option-unknown-generic
      - tcp-option-user-timeout
      - tcp-option-tcp-ao
      - tcp-option-tcp-eno
      - tcp-option-accurate-ecn
      - tcp-option-experimental
      - tcp-option-malformed-length
  - name: ipv6_tcp_payload
    root: "l3:ipv6"
    layers:
      - ipv6
      - tcp
      - payload
    coverage_cases:
      - tcp-header-syn-ack
      - tcp-header-ipv6-checksum
      - tcp-header-raw-payload
      # Focused single-option cases also run over the IPv6 TCP stack so both
      # families stay eligible under the tcp-options profile.
      - tcp-option-mss
      - tcp-option-window-scale
      - tcp-option-sack-permitted
      - tcp-option-sack
      - tcp-option-timestamp
      - tcp-option-fast-open
      - tcp-option-mptcp-generic
      - tcp-option-unknown-generic
      - tcp-option-user-timeout
      - tcp-option-tcp-ao
      - tcp-option-tcp-eno
      - tcp-option-accurate-ecn
      - tcp-option-experimental
      - tcp-option-malformed-length
  - name: ipv4_icmp_payload
    root: "l3:ipv4"
    layers:
      - ipv4
      - icmp
      - payload
    coverage_cases:
      - ipv4-icmp
      - icmpv4-echo-reply
  - name: l2_ipv4_payload
    root: "l2:ipv4"
    layers:
      - ipv4
      - payload
    coverage_cases:
      - ipv4-icmp
  - name: l2_ipv4_icmp_payload
    root: "l2:ipv4"
    layers:
      - ipv4
      - icmp
      - payload
    coverage_cases:
      - ipv4-icmp
      - icmpv4-echo-reply
      - icmpv4-destination-unreachable
      - icmpv4-frag-needed-next-hop-mtu
      - icmpv4-time-exceeded
      - icmpv4-parameter-problem
      - icmpv4-redirect
      - icmpv4-source-quench
      - icmpv4-timestamp
      - icmpv4-information
      - icmpv4-address-mask
      - icmpv4-router-solicitation
      - icmpv4-router-advertisement
      - icmpv4-extensions-mpls
      - icmpv4-extensions-interface-info
      - crafter-icmpv4-errors-extensions
      - icmpv4-extended-echo-request
      - crafter-icmpv4-legacy-types
  - name: ipv4_dns
    root: "l3:ipv4"
    layers:
      - ipv4
      - udp
      - dns
    coverage_cases:
      - dns-query
      - dns-response-records
      - dns-multiple-questions
      - dns-multi-question-classes
      - dns-header-flags-opcodes
      - dns-header-id
      - dns-header-qr
      - dns-header-flags
      - dns-header-opcode
      - dns-header-rcode
      - dns-header-raw-flags
      - dns-header-counts
      - dns-header-empty-sections
      - dns-name-root
      - dns-name-trailing-dot
      - dns-name-label-boundary
      - dns-name-escaped
      - dns-name-non-text
      - dns-name-root-escaped
      - dns-name-compressed
      - dns-compressed-names
      - crafter-dns-name-uncompressed
      - dns-question-class
      - dns-question-unknown-codes
      - dns-record-a
      - dns-record-aaaa
      - dns-a-aaaa-records
      - dns-name-records
      - dns-name-records-compressed
      - dns-record-ns
      - dns-record-cname
      - dns-record-ptr
      - dns-record-mx
      - dns-record-txt
      - dns-mx-txt-records
      - dns-record-soa
      - dns-record-srv
      - dns-soa-srv-records
      - dns-raw-unknown-records
      - dns-record-raw-unknown
      - dns-record-raw-deferred
      - dns-record-raw-empty
      - dns-edns-opt-basic
      - dns-edns-opt-ttl-fields
      - dns-edns-options
      - dns-edns-options-known
      - dns-edns-options-unknown
      - dnssec-ds-dnskey-rrsig
      - dns-dnssec-ds
      - dns-dnssec-dnskey
      - dns-dnssec-rrsig
      - dnssec-nsec-bitmaps
      - dns-dnssec-nsec
      - dns-dnssec-nsec-bitmap
      - dnssec-nsec3
      - dns-dnssec-nsec3
      - dns-dnssec-nsec3-empty-salt
      - dns-dnssec-unknown-algorithm
      - dns-svcb-https
      - dns-svcb-alias
      - dns-svcb-service
      - dns-svcb-root-target
      - dns-https-service
      - dns-svcb-unknown-param
      - dns-section-placement
      - dns-section-authority
      - dns-section-additional
      - dns-section-multi
      - udp-options-known-dns-surplus
  # ethernet / ipv4 / udp / dhcp: link-layer DHCP for offline byte
  # equivalence, pcap, link-type, and decode-root coverage. It stays
  # link-layer-gated for live (requires_l2 / requires_provider_mac /
  # requires_broadcast) and is not used for provider-backed live exchanges.
  - name: ethernet_dhcp
    root: "link:ethernet"
    layers:
      - ethernet
      - ipv4
      - udp
      - dhcp
    coverage_cases:
      - dhcp-discover
      - udp-options-known-dhcp-surplus
      - dhcp-request-offer-ack
      - dhcp-inform-release-generic-options
      - dhcp-decline-nak
      - dhcp-force-renew
      - dhcp-lease-query
      - dhcp-option-matrix
  # ipv4 / udp / dhcp (root l3:ipv4): the live DHCP packet under test. Live
  # validation is a one-way packet-equivalence exchange run in both directions
  # (libcrafter_to_reference and reference_to_libcrafter) with NO expected DHCP
  # reply. It is not a DHCP client, server, lease, or relay emulation. Rooted at
  # IPv4 unicast it is wire-eligible without L2 framing, broadcast, or provider
  # MAC discovery. Scapy is the live reference backend; Wireshark/tshark is
  # parser-only and never acts as a live endpoint.
  - name: ipv4_udp_dhcp
    root: "l3:ipv4"
    layers:
      - ipv4
      - udp
      - dhcp
    coverage_cases:
      - dhcp-discover
      - dhcp-request-offer-ack
      - dhcp-inform-release-generic-options
      - dhcp-decline-nak
      - dhcp-force-renew
      - dhcp-lease-query
      - dhcp-option-matrix
  - name: ipv6_udp_payload
    root: "l3:ipv6"
    layers:
      - ipv6
      - udp
      - payload
    coverage_cases:
      - udp-ipv6-checksum-length
      - udp-ipv6-zero-checksum
      - udp-options-known
      - udp-options-ocs
      - udp-options-apc
      - udp-options-unknown-safe
      - udp-options-unknown-unsafe
      - udp-options-unsupported-frag
      - udp-options-surplus-application-boundary
  - name: ipv6_payload
    root: "l3:ipv6"
    layers:
      - ipv6
      - payload
    coverage_cases:
      - ipv6-boundary-fields
      - ipv6-unknown-next-header-raw
      - crafter-ipv6-boundary-fields
      - crafter-ipv6-unknown-next-header-raw
  - name: ipv6_icmpv6
    root: "l3:ipv6"
    layers:
      - ipv6
      - icmpv6
    # ICMPv6 echo/error plus the IPv6 Neighbor Discovery (RFC 4861) and MLD
    # (RFC 2710 / RFC 3810 / RFC 9777) case ids. These case ids let the live
    # runner resolve a focused NDP/MLD case
    # (`tools/oracle/run live --case ndp-neighbor-solicitation`) onto the
    # ICMPv6 stack. The packet rides next-header 58 over IPv6, so a provider
    # without IPv6 unicast (Hetzner) marks the case wire-ineligible with the
    # stable `requires_ipv6` reason and the live run skips it cleanly, the same
    # IPv6-capability gating every ICMPv6 case already follows; providers that
    # carry same-segment IPv6 link-layer multicast (QEMU, VirtualBox) plan it.
    # Byte-exact NDP/MLD interop is pinned by the scapy bidirectional cases in
    # fixtures/scapy-cases.json and the crafter round-trip tests; this list is
    # the live-path case registry, not an offline byte-corpus generator.
    coverage_cases:
      - ipv6-icmp
      - ndp-router-solicitation
      - ndp-router-advertisement
      - ndp-neighbor-solicitation
      - ndp-neighbor-advertisement
      - ndp-redirect
      - mldv1-general-query
      - mldv1-report
      - mldv1-done
      - mldv2-general-query
      - mldv2-report-two-records
  - name: ipv6_fragment_udp
    root: "l3:ipv6"
    layers:
      - ipv6
      - ipv6_fragment
      - udp
      - payload
    coverage_cases:
      - ipv6-fragment-udp
      - crafter-ipv6-fragment-udp
  - name: ipv6_hop_by_hop_payload
    root: "l3:ipv6"
    layers:
      - ipv6
      - ipv6_hop_by_hop
      - payload
    coverage_cases:
      - ipv6-hop-by-hop-options
      - ipv6-option-metadata
  - name: ipv6_destination_options_payload
    root: "l3:ipv6"
    layers:
      - ipv6
      - ipv6_destination_options
      - payload
    coverage_cases:
      - ipv6-destination-options
      - ipv6-option-metadata
  - name: ipv6_routing_payload
    root: "l3:ipv6"
    layers:
      - ipv6
      - ipv6_routing
      - payload
    coverage_cases:
      - ipv6-routing-generic
      - ipv6-mobile-routing
  - name: ipv6_routing_udp_payload
    root: "l3:ipv6"
    layers:
      - ipv6
      - ipv6_routing
      - udp
      - payload
    coverage_cases:
      - ipv6-segment-routing-udp
      - crafter-ipv6-segment-routing-udp
  - name: ipv6_routing_tcp_payload
    root: "l3:ipv6"
    layers:
      - ipv6
      - ipv6_routing
      - tcp
      - payload
    coverage_cases:
      - ipv6-extension-chain-tcp-raw
      - crafter-ipv6-routing-tcp-raw
  - name: ipv6_routing_icmpv6
    root: "l3:ipv6"
    layers:
      - ipv6
      - ipv6_routing
      - icmpv6
    coverage_cases:
      - ipv6-routing-icmpv6
      - crafter-ipv6-routing-icmpv6
  # ipv4 / esp / payload: ESP (RFC 4303, IP protocol 50) transport mode over
  # IPv4. The AEAD (AES-GCM-16) and CBC+HMAC suites and the NULL-cipher opaque
  # shape are byte-pinned (key/salt/IV/SPI) so the IV || ciphertext || ICV is
  # deterministic and byte-comparable against the Scapy reference backend. These
  # are offline/dry-run only; documentation address space.
  - name: ipv4_esp_payload
    root: "l3:ipv4"
    layers:
      - ipv4
      - esp
      - payload
    coverage_cases:
      - esp-aead-transport
      - esp-cbc-hmac-transport
      - esp-null-opaque
      - esp-sequence-boundary
      - crafter-esp-aead-transport
      - crafter-esp-cbc-hmac-transport
  # ipv4 / esp / ipv4 / payload: ESP tunnel mode over IPv4 carrying an inner
  # IPv4 datagram (ESP next-header 4). The inner IP datagram is encrypted under
  # the SA and dispatched as nested typed layers on decode.
  - name: ipv4_esp_tunnel_ipv4
    root: "l3:ipv4"
    layers:
      - ipv4
      - esp
      - ipv4
      - payload
    coverage_cases:
      - esp-tunnel-inner-ip
  # ipv6 / esp / payload: ESP transport mode over IPv6 (next-header 50),
  # exercising the IPv6 ESP path with the same pinned AEAD/CBC suites.
  - name: ipv6_esp_payload
    root: "l3:ipv6"
    layers:
      - ipv6
      - esp
      - payload
    coverage_cases:
      - esp-aead-transport
      - esp-cbc-hmac-transport
  # ipv4 / ah / tcp / payload: AH (RFC 4302, IP protocol 51) transport mode over
  # IPv4 authenticating a TCP segment. The ICV is computed over the canonical
  # immutable IPv4 fields, the ICV-zeroed AH header, and the upper-layer data
  # with a pinned integrity key so the appended ICV is byte-comparable.
  - name: ipv4_ah_tcp
    root: "l3:ipv4"
    layers:
      - ipv4
      - ah
      - tcp
      - payload
    coverage_cases:
      - ah-hmac-transport
      - ah-sequence-boundary
      - crafter-ah-hmac-transport
  # ipv6 / ah / tcp / payload: AH transport mode over IPv6 authenticating a TCP
  # segment, exercising IPv6 canonicalization (traffic class, flow label, hop
  # limit zeroed) and the 64-bit ICV alignment.
  - name: ipv6_ah_tcp
    root: "l3:ipv6"
    layers:
      - ipv6
      - ah
      - tcp
      - payload
    coverage_cases:
      - ah-ipv6-transport
  # ipv4 / udp / ikev2 / payload: IKEv2 (RFC 7296) message over UDP/500. The
  # IKE_SA_INIT and IKE_AUTH chains, the SK (Encrypted) payload, and the
  # unknown-payload-raw contract are byte-comparable against the Scapy ISAKMP
  # reference backend with pinned SPIs and payload bodies.
  - name: ipv4_udp_ikev2
    root: "l3:ipv4"
    layers:
      - ipv4
      - udp
      - ikev2
      - payload
    coverage_cases:
      - ikev2-sa-init
      - ikev2-auth
      - ikev2-sk-encrypted
      - ikev2-unknown-payload-raw
      - crafter-ikev2-sa-init
      - crafter-ikev2-auth
  # ipv4 / udp / esp / payload: NAT-T UDP-encapsulated ESP over UDP/4500
  # (RFC 3948). Traffic that does not begin with the 4-byte non-ESP (zero)
  # marker is UDP-encapsulated ESP; the marker routes to IKEv2 instead. The ESP
  # body uses the same pinned suites as the bare-IP ESP stacks.
  - name: ipv4_udp4500_esp
    root: "l3:ipv4"
    layers:
      - ipv4
      - udp
      - esp
      - payload
    coverage_cases:
      - esp-aead-transport
      - crafter-esp-aead-transport

constraints:
  - name: ethernet_children
    parent: ethernet
    children:
      - vlan
      - arp
      - ipv4
      - ipv6
      - payload
  - name: vlan_children
    parent: vlan
    children:
      - ipv4
      - ipv6
      - payload
  # ARP rides Linux cooked capture (DLT_LINUX_SLL) the same way it rides
  # Ethernet; the crafter crate already decodes/encodes the LinuxSll/ARP fixture.
  - name: linux_cooked_children
    parent: linux_cooked
    children:
      - arp
      - ipv4
  - name: ipv4_children
    parent: ipv4
    children:
      - udp
      - tcp
      - icmp
      - dns
      - esp
      - ah
      - payload
  - name: ipv6_children
    parent: ipv6
    children:
      - udp
      - tcp
      - icmpv6
      - ipv6_fragment
      - ipv6_routing
      - esp
      - ah
      - payload
  # ESP and AH (IP protocol 50 / 51) carry an inner upper-layer protocol in
  # transport mode (tcp / udp / icmp / payload) or an inner IP datagram in
  # tunnel mode (ipv4 / ipv6). The esp/ah layer specs already declare these
  # children; this constraint keeps the adjacency explicit alongside the ESP/AH
  # stacks above.
  - name: esp_children
    parent: esp
    children:
      - payload
      - ipv4
      - ipv6
      - tcp
      - udp
      - icmp
  - name: ah_children
    parent: ah
    children:
      - payload
      - ipv4
      - ipv6
      - tcp
      - udp
      - icmp
  # UDP carries IKEv2 (UDP/500, and UDP/4500 after the non-ESP marker) and, for
  # NAT-T, UDP-encapsulated ESP (UDP/4500, RFC 3948). The dns/dhcp/payload
  # children come from the udp layer spec; this constraint unions in the IPSec
  # children.
  - name: udp_children
    parent: udp
    children:
      - dns
      - dhcp
      - ikev2
      - esp
      - payload

backend_support:
  scapy:
    status: supported
    encode: true
    decode: true
  libcrafter:
    status: partial
    encode: true
    decode: true
    notes:
      - Planned and malformed cases remain explicit feature-level support entries.
