version: 1
kind: feature
name: udp_options
summary: UDP surplus-area options, option checksums, application payload boundary, and checksum status edge cases.

layers:
  - udp
directions:
  - reference_to_libcrafter
  - libcrafter_to_reference
  - roundtrip
strict_bytes: true
malformed: false

behaviors:
  - name: known
    option_kinds:
      - nop
      - mds
      - mrds
      - req
      - res
      - time
  - name: ocs
    checks:
      - option_checksum
  - name: apc
    option_kinds:
      - apc
    checks:
      - additional_payload_checksum
  - name: unknown_safe
    option_kinds:
      - unassigned_safe
  - name: unknown_unsafe
    option_kinds:
      - unassigned_unsafe
  - name: unsupported_frag
    option_kinds:
      - frag
  - name: ipv4_zero_checksum
    checksum_status:
      - ipv4_no_checksum
  - name: ipv6_zero_checksum
    checksum_status:
      - ipv6_zero_checksum_exception_required
  - name: surplus_application_boundary
    checks:
      - udp_length_excludes_surplus
      - application_payload_excludes_options

coverage_cases:
  - udp-options-known
  - udp-options-ocs
  - udp-options-apc
  - udp-options-unknown-safe
  - udp-options-unknown-unsafe
  - udp-options-unsupported-frag
  - udp-ipv4-zero-checksum
  - udp-ipv6-zero-checksum
  - udp-options-surplus-application-boundary
  - udp-options-known-dns-surplus
  - udp-options-known-dhcp-surplus

live_cases:
  - name: no-options
    case: ipv4-udp
    root: "l3:ipv4"
    family: udp
    feature: null
    expected_live: eligible
  - name: ocs
    case: udp-options-ocs
    root: "l3:ipv4"
    family: udp
    feature: udp_options
    expected_live: eligible
  - name: apc
    case: udp-options-apc
    root: "l3:ipv4"
    family: udp
    feature: udp_options
    expected_live: eligible
  - name: unknown-safe
    case: udp-options-unknown-safe
    root: "l3:ipv4"
    family: udp
    feature: udp_options
    expected_live: eligible
  - name: unknown-unsafe
    case: udp-options-unknown-unsafe
    root: "l3:ipv4"
    family: udp
    feature: udp_options
    expected_live: eligible
  - name: dns-surplus
    case: udp-options-known-dns-surplus
    root: "l3:ipv4"
    family: udp
    feature: udp_options
    expected_live: eligible
  - name: dhcp-surplus
    case: udp-options-known-dhcp-surplus
    root: "link:ethernet"
    family: udp
    feature: udp_options
    expected_live: provider-gated
    skip_reasons:
      - requires_l2
      - requires_broadcast
      - requires_provider_mac
      - requires_controlled_service
  - name: ipv4-zero-checksum
    case: udp-ipv4-zero-checksum
    root: "l3:ipv4"
    family: udp
    feature: udp_options
    expected_live: eligible
  - name: ipv6-zero-checksum-status
    case: udp-ipv6-zero-checksum
    root: "l3:ipv6"
    family: udp
    feature: udp_options
    expected_live: provider-gated
    skip_reasons:
      - requires_ipv6
  - name: unsupported-frag-preservation
    case: udp-options-unsupported-frag
    root: "l3:ipv4"
    family: udp
    feature: udp_options
    expected_live: eligible

backend_support:
  scapy:
    status: supported
    notes:
      - Scapy has no native RFC 9868 UDP option layer; the backend materializes exact surplus bytes and normalizes them as byte-level UDP option metadata.
  libcrafter:
    status: partial
    notes:
      - Step 34 generates fields.udp.options logical surplus intent; libcrafter materialization follows in adapter steps.
