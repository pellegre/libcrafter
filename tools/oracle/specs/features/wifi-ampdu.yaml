version: 1
kind: feature
name: wifi_ampdu
summary: Independent HT A-MPDU delimiter and frame-boundary recovery.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: ht-delimiters
    source: IEEE 802.11-2020 9.7.1-3 and Figure 9-977
    checks: [twelve_bit_length, crc_bit_order, signature, zero_length_padding, four_byte_alignment]
  - name: aggregate-recovery
    source: IEEE 802.11-2020 Annex O.2 informative recovery guidance
    checks: [per_mpdu_fcs, exact_bytes, duplicate_occurrences, invalid_delimiter_resync, bad_fcs_resync, truncated_length, output_bounds]
  - name: ht20-aggregate-iq
    source: IEEE 802.11-2020 clauses 9.7 and 19.3
    checks: [bcc_and_ldpc, mcs_zero_through_seven, both_guard_intervals, per_mpdu_limit, shared_ppdu_coordinates, delimiter_offset_identity, explicit_output_overflow, chunk_continuity]
  - name: capture-replay-integration
    checks: [explicit_modern_selection, recorded_decoder_preservation, incompatible_dispatch_rejection, structured_ht_fields, aggregate_offset_metadata, exact_saved_iq_replay, bounded_header_diagnostics_not_counted_as_frames]
  - name: ht-reference-comparison
    source: https://www.radiotap.org/fields/MCS.html
    checks: [conditional_known_bits, unknown_is_not_bcc_or_no_stbc, exact_mac_bytes, per_occurrence_matching, known_metadata_conflicts, explicit_qualification_gaps]
  - name: partially-damaged-ldpc-aggregate
    checks: [bounded_codeword_estimates, strict_nonaggregate_policy_preserved, per_mpdu_fcs_required, intact_later_mpdu_recovery, explicit_partial_ldpc_diagnostic]
coverage_cases: [wifi-ht-ampdu]
supported_cases:
  - {name: wifi-ht-ampdu, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - WifiDecoder recovers exact MPDUs from 128 independent complete BCC and LDPC HT20 aggregate waveforms at three chunk sizes.
      - Identical MPDUs retain separate delimiter offsets and shared PPDU coordinates.
      - Per-MPDU byte limits and explicit aggregate output overflow are covered.
      - Offline recovery does not qualify live capture, STBC, greenfield or later PHY families.
