version: 1
kind: feature
name: wifi_he_sig_b_coded
summary: HE SIG-B block recovery with continuous puncturing and independent block integrity.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: coded-blocks
    source: IEEE 802.11ax-2021 27.3.11.8.5 and Table 27-111; IEEE 802.11-2020 17.3.5.6
    checks: [all_sig_b_rates, continuous_puncturing, common_and_users, odd_final_user, independent_crc_failure, truncation_atomicity, erased_blocks, finite_metrics, independent_vectors]
coverage_cases: [wifi-he-sig-b-coded]
supported_cases:
  - {name: wifi-he-sig-b-coded, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Private soft-bit block kernel. Input is deinterleaved, DCM-combined coded metrics; IQ demodulation and MU DATA integration remain pending.
      - Puncturing phase continues across blocks while each block resets the BCC trellis. CRC and tail validation remain independent of traceback.
      - Structurally complete blocks advance the cursor even on integrity failure; truncated input and invalid requested user counts do not advance it.
      - Encoded padding after the last user block is not interpreted as another user.
