version: 1
kind: feature
name: wifi_he_capacity
summary: HE20 SU rate dimensions and pre/post-FEC payload boundaries.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: su-payload-capacity
    source: IEEE 802.11ax-2021 Tables27-33/79-86, 27.3.12.5/9/12, Equations27-60-74/140-143
    checks: [mcs_rates, dcm_restrictions, bcc_restrictions, stbc_grouping, pre_fec_padding, ldpc_extra_segment_wrap, psdu_octet_floor, checked_arithmetic]
coverage_cases: [wifi-he-su-capacity]
supported_cases:
  - {name: wifi-he-su-capacity, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Private capacity arithmetic, not coded DATA recovery or MIMO qualification. Timing/header integrity must be established separately.
      - LDPC extra-segment fixtures check signaled geometry in both branches, not the encoder puncturing threshold decision or valid LDPC codewords.
