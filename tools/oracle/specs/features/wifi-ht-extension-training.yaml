version: 1
kind: feature
name: wifi_ht_extension_training
summary: HT20 one-data-stream DATA recovery after extension channel training.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: extension-field-geometry
    source: IEEE 802.11-2020 19.3.9.4.6 Tables 19-12/13/14 and Equation 19-26
    checks: [nsts_plus_ness_at_most_four, at_most_five_ltf_fields, extension_count_mapping, separate_extension_channels, unchanged_data_channels, sounding_header, exact_data_coordinates]
  - name: complete-iq-recovery
    mcs: [0, 1, 2, 3, 4, 5, 6, 7]
    coding: [bcc, ldpc]
    mixed_guard_interval_ns: [400, 800]
    greenfield_guard_interval_ns: [800]
    checks: [all_nss1_extension_counts, stbc_and_non_stbc, independent_iq, multipath_and_carrier_offset, frame_fcs, chunk_invariance, aggregation]
  - name: admission-and-bounds
    checks: [invalid_stream_dimensions, truncation_within_extension_training, configured_memory_limits, output_limits, reference_metadata_preservation]
coverage_cases: [wifi-ht20-extension-training]
supported_cases:
  - {name: wifi-ht20-extension-training, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - The streaming receiver still rejects NESS greater than zero; independent fixtures precede integration.
      - Greenfield short-GI applicability with additional training remains a source question and is not included in the asserted matrix.
      - No live extension-training qualification, additional independent DATA streams, or modern TX is established here.
