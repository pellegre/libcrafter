version: 1
kind: feature
name: wifi_sampling_clock
summary: Independent OFDM receive-clock impairments distinct from carrier offset.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: false
behaviors:
  - name: independent-clock-matrix
    rates_mbps: [6, 9, 12, 18, 24, 36, 48, 54]
    receiver_clock_ppm: [-20, 0, 20]
    lengths: [short, maximum]
    cfo_hz: 0
    checks: [deterministic_iq, independent_psdu_fcs, sample_count, original_sample_coordinates]
  - name: receiver-clock-recovery
    checks: [exact_psdu_bytes, valid_fcs, chunk_invariance]
    chunk_samples: [127, 65536]
  - name: ht20-clock-matrix
    mcs: [0, 1, 2, 3, 4, 5, 6, 7]
    guard_interval_ns: [400, 800]
    receiver_clock_ppm: [-80, 80]
    lengths: [4095]
    checks: [independent_iq, exact_psdu_bytes, valid_fcs, source_coordinates, chunk_invariance, adaptive_fft_window]
coverage_cases: [wifi-ofdm-clock-matrix]
supported_cases:
  - {name: wifi-ofdm-clock-matrix, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: supported
    notes:
      - Independent fixture inventory is established before implementing clock recovery.
      - Receiver acceptance requires exact bytes across this matrix, not merely fixture hashes.
      - radio_sampling_clock_exact_frame_recovery verifies 48 fixtures at both chunk sizes.
      - HT clock fixtures cover both drift signs and both guard intervals; the FFT window follows pilot-derived drift within the retained DATA samples.
      - Support here is bounded offline clock drift, not arbitrary resampling or live qualification.
