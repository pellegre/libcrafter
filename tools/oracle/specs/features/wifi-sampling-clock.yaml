version: 1
kind: feature
name: wifi_sampling_clock
summary: Independent OFDM receive-clock impairments distinct from carrier offset.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: false
behaviors:
  - name: independent-clock-matrix
    rates_mbps: [6, 9, 12, 18, 24, 36, 48, 54]
    receiver_clock_ppm: [-20, 0, 20]
    lengths: [short, maximum]
    cfo_hz: 0
    checks: [deterministic_iq, independent_psdu_fcs, sample_count, original_sample_coordinates]
coverage_cases: [wifi-ofdm-clock-matrix]
supported_cases:
  - {name: wifi-ofdm-clock-matrix, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: planned
    notes:
      - Independent fixture inventory is established before implementing clock recovery.
      - Receiver acceptance requires exact bytes across this matrix, not merely fixture hashes.
