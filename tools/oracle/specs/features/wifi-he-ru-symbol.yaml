version: 1
kind: feature
name: wifi_he_ru_symbol
summary: One-stream HE20 RU DATA symbol IQ to ordered coded-bit metrics.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: ru-stbc-symbol-pair
    source: IEEE 802.11ax-2021 27.3.12.12-13 and IEEE 802.11-2020 21.3.10.9.4
    checks: [all_he20_ru_positions, two_sts_one_stream, bcc_order, ldpc_order, separate_symbol_phase, branch_erasure, data_tone_erasure, atomic_tracker, dcm_rejection, bounds]
  - name: ru-symbol
    source: IEEE 802.11ax-2021 27.3.12.8-10 and 27.3.12.13
    checks: [all_he20_ru_positions, bcc_order, ldpc_order, dcm, pilot_phase_slope, selective_channel, cfo, erased_data_tones, bounds]
coverage_cases: [wifi-he-ru-symbol]
supported_cases:
  - {name: wifi-he-ru-symbol, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Requires an independently admitted single stream, estimated channel and pilot polarity. Does not validate MU headers, training, FEC or MAC FCS.
      - STBC pairs use two effective channel estimates and summed-channel pilots. No streaming STBC admission or complete MU STBC frame qualification is implied.
