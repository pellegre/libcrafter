version: 1
kind: feature
name: wifi_candidate_recovery
summary: OFDM acquisition recovers from false preambles and continues while bounded DATA candidates are pending.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: false-short-preamble
    checks: [new_short_training_restarts_acquisition, exact_psdu, original_sample_position, chunk_invariance, no_unverified_frame]
  - name: false-long-candidate
    checks: [recover_later_independent_frame, exact_psdu, original_sample_position, valid_fcs]
  - name: weak-training
    modes: [legacy_ofdm, ht20_single_stream]
    checks: [independent_noisy_stf, complementary_ltf_errors, exact_psdu, valid_fcs, chunk_invariance, no_duplicate_occurrence, original_acquisition_priority]
  - name: bounded-hypotheses
    max_candidates: 2
    checks: [shared_sample_reservation_bound, reset_all_candidates, no_unverified_frame]
coverage_cases: [wifi-false-short-preamble, wifi-false-long-candidate, wifi-bounded-candidates, wifi-weak-training]
supported_cases:
  - {name: wifi-false-short-preamble, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
  - {name: wifi-false-long-candidate, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
  - {name: wifi-bounded-candidates, directions: [backend_to_libcrafter], byte_policy: structured_error, contract_only: true}
  - {name: wifi-weak-training, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: supported
    notes:
      - Synthetic periodic bursts precede independent legacy and HT fixtures across all supported single-stream rates.
      - Rust tests use a deliberately false length and an independent recovered-frame fixture.
      - Weak training uses a secondary acquisition that cannot reset the original search or displace its DATA reservations.
      - Candidate capacity and aggregate sample reservations are bounded; excess acquisition is rejected.
