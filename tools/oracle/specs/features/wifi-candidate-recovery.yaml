version: 1
kind: feature
name: wifi_candidate_recovery
summary: OFDM acquisition continues while a bounded DATA candidate is pending.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: false-long-candidate
    checks: [recover_later_independent_frame, exact_psdu, original_sample_position, valid_fcs]
  - name: bounded-hypotheses
    max_candidates: 2
    checks: [shared_sample_reservation_bound, reset_all_candidates, no_unverified_frame]
coverage_cases: [wifi-false-long-candidate, wifi-bounded-candidates]
supported_cases:
  - {name: wifi-false-long-candidate, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
  - {name: wifi-bounded-candidates, directions: [backend_to_libcrafter], byte_policy: structured_error, contract_only: true}
backend_support:
  libcrafter:
    status: supported
    notes:
      - Rust tests use a deliberately false length and an independent recovered-frame fixture.
      - Candidate capacity and aggregate sample reservations are bounded; excess acquisition is rejected.
