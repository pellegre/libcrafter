version: 1
kind: feature
name: wifi_he_tb_capacity
summary: Explicit Trigger HE20 per-user RU geometry and payload budgets.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: tb-capacity
    source: IEEE 802.11ax-2021 Table 9-29i, 26.5.2.3.3 and 27.3.12.5.5
    checks: [trigger_ru_codepoints, scheduled_spatial_mapping, random_access_stream_count, reserved_aid_rejection, per_user_mcs_and_coding, raw_padding_mapping, short_dcm_segments, bcc_filler, ldpc_extra_budget, independent_forward_geometry]
coverage_cases: [wifi-he-tb-capacity]
supported_cases:
  - {name: wifi-he-tb-capacity, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Shared independent per-RU forward budget corpora check arithmetic through explicit Trigger Common/User fields, without manufacturing MU headers.
      - Geometry does not establish Trigger association, cross-user spatial consistency, LDPC puncturing admission or MAC integrity. Random-access RU expansion remains separate.
