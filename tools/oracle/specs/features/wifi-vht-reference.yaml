version: 1
kind: feature
name: wifi_vht_reference
summary: Explicit VHT reference metadata and bounded occurrence comparison.
layers: [radiotap, dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: conditional-reference-fields
    source: https://www.radiotap.org/fields/VHT.html
    checks: [known_guard_and_bandwidth, present_user_mcs_nss, conditional_stbc_group_aid_beamforming, per_present_user_coding, unsupported_modes_explicit]
  - name: occurrence-comparison
    source: https://www.radiotap.org/fields/A-MPDU%20status.html
    checks: [eof_known_bit, exact_mac_bytes, no_ht_vht_cross_match, known_metadata_conflicts, unknown_configuration_gap, aggregate_interval, bounded_header_diagnostics]
coverage_cases: [wifi-vht-reference-metadata]
supported_cases:
  - {name: wifi-vht-reference-metadata, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Reference eligibility follows the currently implemented VHT20 SU one-stream BCC receive subset; excluded LDPC, STBC, MU or wider-channel observations are not coverage claims.
      - Unknown STBC or group information may support a byte match but remains an explicit qualification gap.
