version: 1
kind: feature
name: wifi_eht_ofdma_data_iq
summary: EHT20 downlink OFDMA one-stream DATA IQ to per-user raw PSDU bytes.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: disjoint-resource-data
    source: IEEE 802.11be-2024 Tables 36-34, 36-35 and 36-48; IEEE 802.11 TGbe 11-21/0566r0, 11-21/1153r2 and 11-23/1598r1
    checks: [ru26, ru52, ru106, ru242, simultaneous_users, ordered_user_ownership, independent_channel_training]
  - name: per-user-bcc-recovery
    source: IEEE 802.11be-2024 Clause 36.3.12.8; IEEE 802.11 TGbe 11-21/0566r0 and 11-23/1598r1
    checks: [mcs0_through_9, mcs15, dcm, bcc_interleaving, service, scrambler, padding, exact_raw_psdu_bytes]
  - name: per-user-ldpc-recovery
    source: IEEE 802.11be-2024 Clauses 36.3.12.6 and 36.3.12.9; IEEE 802.11 TGbe 11-21/0566r0 and 11-23/1025r1
    checks: [mcs0_through_12, mcs15, dcm, ldpc_tone_mapping, rate_matching, common_extra_symbol, exact_raw_psdu_bytes]
  - name: stream-boundary-recovery
    source: IEEE 802.11be-2024 Clauses 36.3.10 and 36.3.12; IEEE 802.11 TGbe 11-21/1153r2 and 11-23/1598r1
    checks: [all_eht_ltf_modes, arbitrary_input_chunks, exact_sample_coordinates, cfo, multipath]
coverage_cases: [wifi-eht-ofdma-data-iq]
supported_cases:
  - {name: wifi-eht-ofdma-data-iq, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Ordinary disjoint 26-, 52-, 106-, and 242-tone single-component RUs with one spatial stream and BCC or LDPC coding are recovered from complete 20 MHz captures.
      - MCS 13 has bit-level coverage but is not claimed robust from eight-bit IQ; MCS 12 has exact IQ coverage on a full 242-tone RU.
      - Multi-RU joint mapping remains a separate DATA path.
      - Overlapping MU-MIMO users require independent receive chains and are outside the single-HackRF receive contract.
