version: 1
kind: feature
name: wifi_he_mu_tones
summary: HE20 allocation-specific subcarrier geometry and one-stream permutations.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: mu-tones
    source: IEEE 802.11ax-2021 Tables 27-7, 27-35 through 27-43
    checks: [all_20mhz_rus, pilot_locations, pilot_signs, data_counts, permutation_bounds, su_er_compatibility]
coverage_cases: [wifi-he-mu-tones]
supported_cases:
  - {name: wifi-he-mu-tones, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Private geometry for all sixteen HE20 RUs; RU indices are one-based within each size, not SIG-B first_slot values.
      - BCC permutation is the existing one-stream mapping. Spatial-stream rotation and MU training/DATA integration remain separate work.
