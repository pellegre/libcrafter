version: 1
kind: feature
name: wifi_he_mu_bcc
summary: Recover per-user HE20 MU BCC payload bytes from soft metrics.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: mu-bcc
    source: IEEE 802.11ax-2021 27.3.12.1 through 27.3.12.5.1 and 27.4.3
    checks: [exact_psdu, per_user_capacity, post_fec_padding, conditional_dcm_filler, service_validation, payload_limit, invalid_metrics, su_er_compatibility]
coverage_cases: [wifi-he-mu-bcc]
supported_cases:
  - {name: wifi-he-mu-bcc, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Deinterleaved and stream-recombined soft metrics only. Caller verifies signaling and spatial admission; output bytes still require MAC/FCS validation.
      - Per-user BCC uses RU capacity and global STBC grouping; no MU IQ demodulation or complete streaming DATA integration yet.
