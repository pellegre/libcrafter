version: 1
kind: feature
name: wifi_he_er_prefix
summary: HE ER SU repeated signaling recovery and bounded public header diagnostics.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: er-prefix
    source: IEEE 802.11ax-2021 27.3.11.3-7/22, Table27-18, Figure27-25, Equations27-11/12/18
    checks: [repeated_lsig_modulo2, qbpsk_second_symbol, uninterleaved_repeats, weighted_combining, pilot_polarity, training_power_normalization, reserved_er_fields, checked_bounds, public_header_diagnostics]
coverage_cases: [wifi-he-er-prefix]
supported_cases:
  - {name: wifi-he-er-prefix, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Signaling only. No DATA or MAC integrity is established. ER242/upper106 training, capacity, DATA demodulation and live interoperability remain separate completion work.
      - The SU and ER SU header bit layout is shared; the diagnostic variant establishes the interpretation of the Bandwidth field.
