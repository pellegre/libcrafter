version: 1
kind: feature
name: wifi_he_ampdu
summary: HE aggregate byte recovery distinguishes tagged MPDUs from EOF padding.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: framing
    source: IEEE 802.11ax-2021 9.7.1 Table9-527, 10.12.6-7 and 26.6.2
    checks: [fourteen_bit_length, delimiter_crc, tag_preserved, mixed_tagged_frames, eof_padding_order, fcs_valid_only, resynchronization, caller_mpdu_limit, ht_vht_unchanged]
coverage_cases: [wifi-he-ampdu-bytes]
supported_cases:
  - {name: wifi-he-ampdu-bytes, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Private byte framing, not public HE IQ integration or hardware qualification.
      - Tag bits are preserved without interpreting acknowledgment policy or validating negotiated aggregation contexts.
      - Caller bounds PSDU storage and PHY capacity. Only zero-length tagged delimiters start EOF padding; later frames are rejected.
