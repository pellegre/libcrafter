version: 1
kind: feature
name: wifi_he_mu_prefix
summary: HE20 MU IQ preamble recognition and checked SIG-A diagnostics.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: mu-prefix
    source: IEEE 802.11ax-2021 27.3.11.7 and 27.3.22
    checks: [repeated_legacy_header, bpsk_discriminator, crc_tail_validation, independent_iq, cfo_selective_channel, truncation, nonfinite_rejection, bounded_streaming, gap_reset, typed_diagnostics, artifact_metadata]
coverage_cases: [wifi-he-mu-prefix]
supported_cases:
  - {name: wifi-he-mu-prefix, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - HE20 MU SIG-A recognition only. SIG-B allocation and MU DATA recovery are not yet admitted; checked headers report UnsupportedPhy and publish no MAC frames.
      - Prefix fixtures are independent offline evidence, not live radio or throughput qualification.
