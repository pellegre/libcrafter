version: 1
kind: feature
name: wifi_he_mu_ldpc_layout
summary: HE20 per-user MU LDPC codeword geometry and common extra-segment handling.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: mu-ldpc-layout
    source: IEEE 802.11ax-2021 27.3.12.5.4 Equations 27-79 through 27-84
    checks: [per_user_capacity, shortening, puncturing, repetition, peer_required_extra, missing_required_extra, su_strict_extra]
coverage_cases: [wifi-he-mu-ldpc-layout]
supported_cases:
  - {name: wifi-he-mu-ldpc-layout, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Per-user geometry accepts a common extra segment requested by another LDPC user, but rejects a missing segment needed by this user.
      - Caller validates aggregate signaling and spatial admission. This kernel does not establish that at least one peer requested an extra segment, or recover MU IQ payloads.
