version: 1
kind: feature
name: dot11_trigger
summary: Typed HE Trigger scheduling fields with lossless opaque extensions.
layers: [dot11]
directions: [backend_to_libcrafter, libcrafter_to_backend, roundtrip]
strict_bytes: true
malformed: true
behaviors:
  - name: trigger-body
    source: IEEE 802.11ax-2021 9.3.1.22 and 9.3.1.7; IEEE 802.11-2020 9.3.1.7
    checks: [common_user_bit_mapping, variant_boundaries, padding_preserved, unknown_body_preserved, structured_truncation, radiotap_fcs_boundary, packet_roundtrip]
coverage_cases: [dot11-trigger-body]
supported_cases:
  - {name: dot11-trigger-body, directions: [backend_to_libcrafter, libcrafter_to_backend, roundtrip], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Common fields and normal HE User Info layouts are typed; NFRP user bodies and unknown variant/BAR boundaries remain opaque and byte-preserved.
      - This does not admit TB IQ DATA, validate scheduling policy, or infer context for TRS-triggered responses.
