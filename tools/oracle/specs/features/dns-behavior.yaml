version: 1
kind: feature
name: dns_behavior
summary: DNS header, names, questions, all four sections, typed records, EDNS, DNSSEC, SVCB/HTTPS, and malformed-decode behavior.

layers:
  - udp
  - dns
directions:
  - reference_to_libcrafter
  - libcrafter_to_reference
strict_bytes: true
malformed: false

behaviors:
  - name: query_a_in
    record_kinds:
      - question_a
  - name: response_records
    record_kinds:
      - a
      - aaaa
      - cname
      - generic
  - name: multiple_questions
    record_kinds:
      - question_a
      - question_aaaa
  - name: truncated_rcode
    flags:
      - truncated
    response_codes:
      - no_error
      - server_failure
      - name_error
  - name: compression
    comparison:
      - strict_bytes
      - normalized_names
  - name: compressed_names
    comparison:
      - normalized_names
    raw_dns: true
  - name: soa_srv_records
    record_kinds:
      - soa
      - srv
  # record_soa and record_srv are the focused single-record variants of the
  # combined soa_srv_records case. Their identifiers (record-soa / record-srv)
  # are substrings only of dns-record-soa / dns-record-srv, never of the
  # combined dns-soa-srv-records id (which matches soa-srv-records), so the
  # behavior matcher keeps all three cases deterministic.
  - name: record_soa
    summary: Focused SOA-only response exercising MNAME, RNAME, SERIAL, REFRESH, RETRY, EXPIRE, and MINIMUM in one record.
    record_kinds:
      - soa
  - name: record_srv
    summary: Focused SRV-only response exercising priority, weight, port, and the nested target name in one record.
    record_kinds:
      - srv
  - name: header_id
    summary: Nonzero transaction ID on an otherwise plain query.
  - name: header_qr
    summary: Response-bit query/response pair with recursion-available set.
  - name: header_flags
    summary: All header flag bits set on a recursive query.
  - name: header_opcode
    summary: Named and unknown opcode values.
    opcodes:
      - status
      - unknown
  - name: header_rcode
    summary: Named and unknown rcode values.
    response_codes:
      - refused
      - unknown
  - name: header_raw_flags
    summary: Reserved Z bit set through the raw-flags escape hatch.
    flags:
      - reserved_z
  - name: header_counts
    summary: Section counts auto-filled across answer/authority/additional.
  - name: header_empty_sections
    summary: Empty answer/authority/additional sections yield zero counts.
  - name: name_root_escaped
    summary: Root name, trailing-dot names, literal dot/backslash labels, and \DDD decimal escapes including a non-UTF-8 label.
  - name: multi_question_classes
    summary: Multiple questions in deterministic order spanning named QTYPEs (A, AAAA, MX, TXT, ANY), a private unknown numeric QTYPE, every named QCLASS (IN, CH, HS, NONE, ANY), and a private unknown numeric QCLASS.
    record_kinds:
      - question_a
      - question_aaaa
  - name: a_aaaa_records
    summary: Authoritative response with A and AAAA answers for documentation IPv4/IPv6 addresses, stable TTLs, and both answer orderings.
    record_kinds:
      - question_a
      - a
      - aaaa
  # name_records_compressed is listed before name_records so the behavior
  # matcher (substring of the case id) resolves dns-name-records-compressed to
  # the compressed behavior; the name_records identifier is a substring of the
  # compressed case id, so the more specific behavior must come first.
  - name: name_records_compressed
    summary: NS, CNAME, and PTR answers whose owner names and embedded RDATA names are compression pointers in the Scapy-owned raw bytes; libcrafter normalizes to the same uncompressed DnsRecordData::Name model on decode.
    record_kinds:
      - cname
      - generic
  - name: name_records
    summary: Authoritative response with NS, CNAME (root-adjacent target), and PTR answers, each carrying a nested <domain-name> as DnsRecordData::Name; uncompressed and byte-exact in both directions.
    record_kinds:
      - cname
      - generic
  - name: mx_txt_records
    summary: Authoritative response with one MX answer (preference + nested exchange name) and TXT answers covering single, multiple, empty, non-UTF-8 binary, and 255-octet character-strings; uncompressed and byte-exact in both directions.
    record_kinds:
      - generic
  # raw_unknown_records carries an unknown private-use numeric TYPE plus the
  # deferred NSEC3PARAM (51), TLSA (52), KEY (25), and NAPTR (35) types, each of
  # which libcrafter keeps as DnsRecordData::Raw. The identifier
  # raw-unknown-records is a substring only of dns-raw-unknown-records and of no
  # other case id, so the behavior matcher resolves it unambiguously.
  - name: raw_unknown_records
    summary: Authoritative response carrying an unknown numeric TYPE and the deferred NSEC3PARAM, TLSA, KEY, and NAPTR types as opaque RDATA; libcrafter decodes each to DnsRecordData::Raw and recompiles the same bytes.
    record_kinds:
      - generic
  # edns_opt_basic is the focused OPT pseudo-record case exercising the EDNS(0)
  # fields that reuse ordinary record fields: UDP payload size (CLASS) and the
  # extended RCODE, version, and DO flag packed into the TTL. Its identifier
  # edns-opt-basic is a substring only of dns-edns-opt-basic, never of the
  # dns-edns-opt-ttl-fields / dns-edns-options-known / dns-edns-options-unknown
  # case ids, so the behavior matcher resolves this case deterministically.
  - name: edns_opt_basic
    summary: Several OPT pseudo-records in the additional section spanning an empty option list, non-default UDP payload sizes, extended RCODE values, EDNS version values, and the DO flag set and clear; the OPT owner name stays root and every field reuses an ordinary record field.
    record_kinds:
      - generic
  # edns_options is the EDNS(0) option-TLV matrix case. Its identifier
  # edns-options is a substring of dns-edns-options but not of dns-edns-opt-basic
  # (so the matcher never selects this for the basic-fields case, and the
  # generator branch is ordered before edns-opt-basic regardless). It carries the
  # three options with named constructors (NSID, COOKIE, Padding), one option
  # that has a registry mnemonic but no constructor (DAU), and one unknown option
  # code, each with raw option data in a fixed order.
  - name: edns_options
    summary: One OPT pseudo-record whose RDATA carries an ordered EDNS(0) option list spanning NSID, COOKIE, Padding, the DAU option (mnemonic without a constructor), and an unknown option code, every option preserving its exact code and opaque data bytes.
    record_kinds:
      - generic
  # dnssec_ds_dnskey_rrsig is the combined core-DNSSEC case carrying one DS, one
  # DNSKEY, and one RRSIG answer in a single authoritative response so the three
  # wire-only delegation/signature records and their opaque key/digest/signature
  # material round trip byte-for-byte in one reproduction. Its identifier
  # dnssec-ds-dnskey-rrsig matches only the combined case id, never the focused
  # dns-dnssec-ds / dns-dnssec-dnskey / dns-dnssec-rrsig ids, so the behavior
  # matcher resolves it deterministically.
  - name: dnssec_ds_dnskey_rrsig
    summary: An authoritative response carrying DS, DNSKEY, and RRSIG answers whose numeric fields and opaque digest/key/signature material are wire data only; uncompressed and byte-exact in both directions.
    record_kinds:
      - generic
  # dnssec_nsec_bitmaps is the combined NSEC type-bitmap case carrying two NSEC
  # answers whose Type Bit Maps exercise a single window block, multiple window
  # blocks, an unknown codepoint, and unsorted/duplicate input values. Both the
  # Scapy DNSRRNSEC reference (RRlist2bitmap) and libcrafter DnsTypeBitmaps sort,
  # de-duplicate, and emit minimal windows, so the normalized type set agrees in
  # both directions. Its identifier dnssec-nsec-bitmaps matches only the combined
  # case id (the shorter dnssec-nsec / dnssec-nsec-bitmap tokens are substrings of
  # it, so this branch is dispatched before any of them), keeping resolution
  # deterministic.
  - name: dnssec_nsec_bitmaps
    summary: An authoritative response carrying NSEC answers whose Type Bit Maps span a single window, multiple windows, an unknown codepoint, and unsorted/duplicate inputs; libcrafter sorts/dedups and emits minimal sorted windows that match the Scapy reference.
    record_kinds:
      - generic

# Normalized comparison contract for the DNS oracle.
#
# These are the backend-neutral field names the oracle uses when it compares a
# decoded DNS message. They are the public contract for both the Scapy and the
# libcrafter materializers: neither side may compare against Scapy-native field
# spellings (DNS.id, DNSQR.qname, DNSRR.rdata, and so on). Each materializer
# maps its own representation onto these names before the oracle compares them.
normalized_model:
  message:
    header:
      - transaction_id
      - is_response
      - opcode
      - authoritative
      - truncated
      - recursion_desired
      - recursion_available
      - authentic_data
      - checking_disabled
      - reserved_z
      - response_code
      - question_count
      - answer_count
      - authority_count
      - additional_count
    sections:
      - questions
      - answers
      - authority
      - additional
  question:
    - name
    - record_type
    - record_class
  record:
    - name
    - record_type
    - record_class
    - ttl
    - rdata
  name:
    - labels
    - presentation
    - is_root
  rdata:
    address:
      - address
    name_target:
      - target
    mail_exchange:
      - preference
      - exchange
    text:
      - strings
    start_of_authority:
      - primary_name
      - responsible_name
      - serial
      - refresh
      - retry
      - expire
      - minimum
    service:
      - priority
      - weight
      - port
      - target
    opt:
      - udp_payload_size
      - extended_rcode
      - version
      - dnssec_ok
      - z_bits
      - options
    edns_option:
      - option_code
      - option_data
    delegation_signer:
      - key_tag
      - algorithm
      - digest_type
      - digest
    dnskey:
      - flags
      - protocol
      - algorithm
      - public_key
    rrsig:
      - type_covered
      - algorithm
      - labels
      - original_ttl
      - signature_expiration
      - signature_inception
      - key_tag
      - signer_name
      - signature
    next_secure:
      - next_name
      - type_bitmaps
    next_secure3:
      - hash_algorithm
      - flags
      - iterations
      - salt
      - next_hashed_owner
      - type_bitmaps
    type_bitmaps:
      - record_types
    service_binding:
      - priority
      - target
      - params
    service_param:
      - key
      - value
    raw:
      - record_type
      - data

# Normalized-only comparison policy for compressed-name cases.
#
# DNS name compression (RFC 1035 Section 4.1.4) lets a message reuse an earlier
# name by pointer. Scapy can dissect a compressed input, but libcrafter always
# re-encodes names uncompressed, so the wire bytes of a compressed-name source
# and the libcrafter re-encode differ on purpose. These cases therefore run with
# byte_policy: normalized: strict byte equality is NOT asserted, and agreement is
# checked on the normalized DNS message model instead.
#
# The normalized model is the backend-neutral structure both backends map onto
# (see normalized_model above). Names are compared in their decoded form -- the
# wire labels and the canonical trailing-dot presentation string with RFC 1035
# Section 5.1 \DDD escapes -- not as packed wire bytes, so a compressed name and
# its uncompressed re-encode compare equal. The Scapy backend builds this model
# in tools/oracle/engine/backends/scapy/normalize.py (_normalize_dns_message),
# which exposes header, questions, answers, authorities, additionals, names,
# types, classes, TTLs, and per-record rdata regardless of compression. The same
# normalized-name rule covers the sorted-SvcParams and minimal-bitmap normalized
# groups below, where libcrafter rewrites RDATA ordering on encode while the
# decoded model still agrees.

# Per-group byte-comparison policy. strict_bytes groups must match Scapy
# octet-for-octet on the deterministic uncompressed encode. normalized groups
# document a specific encode rewrite where only the normalized decoded DNS
# model must agree. structured_error groups assert a typed decode/encode error
# with no panic. Group names are stable coordinates for the rest of the plan.
case_groups:
  - name: dns-header-flags-opcodes
    summary: Header, flag bits, user-specified opcode, rcode, raw-flags escape hatch, and section counts.
    byte_policy: strict_bytes
    cases:
      - dns-header-id
      - dns-header-qr
      - dns-header-flags
      - dns-header-opcode
      - dns-header-rcode
      - dns-header-raw-flags
      - dns-header-counts
      - dns-header-empty-sections
  - name: dns-names
    summary: Root, trailing-dot, label-boundary, escaped, non-text, and combined root/escaped names plus uncompressed encode.
    byte_policy: strict_bytes
    cases:
      - dns-name-root
      - dns-name-trailing-dot
      - dns-name-label-boundary
      - dns-name-escaped
      - dns-name-non-text
      - dns-name-root-escaped
      - crafter-dns-name-uncompressed
  - name: dns-name-compression
    summary: Compressed-name decode; libcrafter re-encodes uncompressed.
    byte_policy: normalized
    normalized_note: libcrafter emits the uncompressed name on re-encode, so the decoded name model agrees while bytes differ from the compressed Scapy input.
    cases:
      - dns-name-compressed
      - dns-compressed-names
      - dns-name-records-compressed
  - name: dns-questions
    summary: Single and multi-question messages, class variants, and unknown numeric codes.
    byte_policy: strict_bytes
    cases:
      - dns-query
      - dns-multiple-questions
      - dns-multi-question-classes
      - dns-question-class
      - dns-question-unknown-codes
  - name: dns-base-records
    summary: A, AAAA, NS, CNAME, PTR, MX, TXT, and the combined response.
    byte_policy: strict_bytes
    cases:
      - dns-record-a
      - dns-record-aaaa
      - dns-record-ns
      - dns-record-cname
      - dns-record-ptr
      - dns-record-mx
      - dns-record-txt
      - dns-response-records
      - dns-a-aaaa-records
      - dns-name-records
      - dns-mx-txt-records
  - name: dns-soa-srv
    summary: SOA and SRV records.
    byte_policy: strict_bytes
    cases:
      - dns-record-soa
      - dns-record-srv
      - dns-soa-srv-records
  - name: dns-raw-records
    summary: Unknown, deferred, and empty RDATA stay DnsRecordData::Raw.
    byte_policy: strict_bytes
    cases:
      - dns-raw-unknown-records
      - dns-record-raw-unknown
      - dns-record-raw-deferred
      - dns-record-raw-empty
  - name: dns-edns-options
    summary: OPT pseudo-record fields and EDNS option TLVs (known and unknown).
    byte_policy: strict_bytes
    cases:
      - dns-edns-opt-basic
      - dns-edns-opt-ttl-fields
      - dns-edns-options
      - dns-edns-options-known
      - dns-edns-options-unknown
  - name: dnssec-ds-dnskey-rrsig
    summary: DS, DNSKEY, and RRSIG fixed fields with raw key/signature material.
    byte_policy: strict_bytes
    cases:
      - dnssec-ds-dnskey-rrsig
      - dns-dnssec-ds
      - dns-dnssec-dnskey
      - dns-dnssec-rrsig
      - dns-dnssec-unknown-algorithm
  - name: dnssec-nsec-bitmaps
    summary: NSEC Type Bit Maps spanning a single window, multiple windows, an unknown codepoint, and unsorted/duplicate inputs that libcrafter sorts and minimizes.
    byte_policy: normalized
    normalized_note: libcrafter DnsTypeBitmaps and the Scapy DNSRRNSEC reference both sort, de-duplicate, and emit minimal windows, so the decoded type set agrees even when the source input order differs.
    cases:
      - dnssec-nsec-bitmaps
  - name: dnssec-nsec
    summary: NSEC next name plus type bitmaps.
    byte_policy: strict_bytes
    cases:
      - dns-dnssec-nsec
  - name: dnssec-nsec-bitmap
    summary: NSEC multi-window bitmap with unknown codepoint; libcrafter emits minimal sorted windows.
    byte_policy: normalized
    normalized_note: libcrafter sorts/dedups and emits minimal windows, so the decoded type set agrees even if the source byte order differs.
    cases:
      - dns-dnssec-nsec-bitmap
  - name: dnssec-nsec3
    summary: NSEC3 hash/salt/next-hash/bitmap material, including empty salt.
    byte_policy: strict_bytes
    cases:
      - dns-dnssec-nsec3
      - dns-dnssec-nsec3-empty-salt
  - name: dns-svcb-https
    summary: SVCB and HTTPS AliasMode/ServiceMode, root targets, and unknown params.
    byte_policy: strict_bytes
    cases:
      - dns-svcb-alias
      - dns-svcb-root-target
      - dns-https-service
      - dns-svcb-unknown-param
  - name: dns-svcb-service-sorted
    summary: SVCB ServiceMode with out-of-order source params; libcrafter sorts SvcParamKeys.
    byte_policy: normalized
    normalized_note: libcrafter sorts SvcParamKeys into strictly increasing order on encode, so an out-of-order source compares by the normalized decoded params.
    cases:
      - dns-svcb-service
  - name: dns-section-placement
    summary: Authority, additional, and multi-section record placement.
    byte_policy: strict_bytes
    cases:
      - dns-section-authority
      - dns-section-additional
      - dns-section-multi
  - name: malformed-dns-names
    summary: Compressed-name and message-boundary decode failures.
    byte_policy: structured_error
    cases:
      - malformed-dns-pointer-cycle
      - malformed-dns-pointer-range
      - malformed-dns-truncated-name
      - malformed-dns-reserved-marker
      - malformed-dns-name-overrun
      - malformed-dns-trailing-bytes
      - malformed-dns-compression
  - name: malformed-dns-rdata
    summary: RDATA boundary decode failures and encode rejections.
    byte_policy: structured_error
    cases:
      - malformed-dns-address-rdlength
      - malformed-dns-soa-rdlength
      - malformed-dns-srv-boundary
      - malformed-dns-edns-option
      - malformed-dns-dnssec-truncation
      - malformed-dns-nsec3-overrun
      - malformed-dns-bitmap
      - malformed-dns-svcb-params
      - malformed-dns-encode-reject
  - name: dns-legacy
    summary: Pre-existing DNS cases retained for reproduction compatibility.
    byte_policy: strict_bytes
    cases:
      - dns-generic-record-truncated-rcode
      - crafter-dns-query-response-compression

coverage_cases:
