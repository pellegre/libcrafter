backend_support:
  scapy:
    status: supported
    native_layers:
      - DNS
      - DNSQR
      - DNSRR
  libcrafter:
    status: partial
    notes:
      - Compression and generic records are planned coverage.
      - Typed records, EDNS, DNSSEC, and SVCB/HTTPS cases are normalized through the backend-neutral DNS model.
