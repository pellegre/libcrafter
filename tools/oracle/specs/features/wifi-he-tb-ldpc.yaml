version: 1
kind: feature
name: wifi_he_tb_ldpc
summary: Trigger-controlled HE20 TB LDPC shortening, puncturing and repetition.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: tb-ldpc-layout
    source: IEEE 802.11ax-2021 27.3.12.5.5 Equation 27-90 and 27.3.12.5.2
    checks: [explicit_extra_zero, explicit_extra_one, initial_padding_reversal, ru_geometry, codeword_dimensions, shortening, puncturing, repetition, stbc_groups, bounds, unchanged_su_mu_policy]
coverage_cases: [wifi-he-tb-ldpc]
supported_cases:
  - {name: wifi-he-tb-ldpc, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Rate-matching geometry only, from explicit Trigger Common/User fields. Timing, Trigger association and IQ decoding are separate.
      - TB follows the signaled extra flag rather than substituting the local transmitter recommendation; existing SU and MU policies are unchanged.
      - This does not relax LDPC convergence, SERVICE checks or per-MPDU FCS qualification.
