version: 1
kind: feature
name: wifi_eht_prefix_iq
summary: EHT preamble classification and U-SIG recovery from 20 Msps IQ.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: eht-preamble-classification
    source: IEEE 802.11 TGbe 11-21/0002r2 L-SIG and RL-SIG
    checks: [six_mbps_l_sig, length_modulo_three, repeated_l_sig, legacy_acquisition, exact_sample_coordinates]
  - name: usig-iq
    source: IEEE 802.11 TGbe 11-21/0049r1 36.3.11.7
    checks: [two_bpsk_symbols, fifty_two_data_tones, pilot_phase, channel_equalization, crc, tail, validate_states, streaming_dispatch, typed_diagnostic]
coverage_cases: [wifi-eht-prefix-iq]
supported_cases:
  - {name: wifi-eht-prefix-iq, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - The streaming receiver recognizes EHT MU and EHT TB U-SIG in a 20 Msps observation; it does not decode EHT-SIG, training or DATA.
      - U-SIG may report a wider PPDU because pre-EHT signaling is duplicated into 20 MHz subchannels; wider DATA cannot be recovered from this capture.
