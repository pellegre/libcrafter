version: 1
kind: feature
name: wifi_ht_stbc
summary: HT one-data-stream two-space-time-stream receive contract.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: two-symbol-combining
    source: IEEE 802.11-2020 19.3.11.9.2 Table 19-18
    checks: [independent_constellation_pairs, either_channel_missing, complex_channels, weak_channels, cancellation, finite_extremes, zero_channel_rejection]
  - name: two-channel-training
    source: IEEE 802.11-2020 19.3.9.4.6 Equation 19-27
    checks: [known_tone_removal, first_two_training_columns, bounded_inverse, nonfinite_rejection]
  - name: complete-iq-recovery
    checks: [two_sts_pilots, even_symbol_count, bcc_and_ldpc, frame_fcs, aggregation, explicit_configuration_bounds, exact_streaming_bytes]
    mixed_guard_interval_ns: [400, 800]
    greenfield_guard_interval_ns: [800]
    lengths: [100, 4095]
    impairments: [clean_two_channel, independent_multipath_and_carrier_offset]
  - name: malformed-and-aggregate-iq
    checks: [header_crc, invalid_stbc_dimensions, invalid_mcs, invalid_extension_count, unusable_training, service_integrity, mac_fcs, ldpc_nonconvergence, truncated_pairs, duplicate_mpdus, damaged_codeword_recovery]
coverage_cases: [wifi-ht20-stbc]
supported_cases:
  - {name: wifi-ht20-stbc, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Streaming HT20 RX supports NSS1/NSTS2 with MCS0-7, BCC or LDPC, mixed GI400/800 and greenfield GI800, without extension training.
      - Independent full-IQ and malformed fixtures exercise the receiver; no live STBC qualification is claimed.
      - Greenfield STBC short GI remains unqualified pending source review; additional data streams and extension training remain unsupported.
