version: 1
kind: feature
name: wifi_he_stbc_iq
summary: HE20 SU single-data-stream STBC training and raw-byte IQ recovery.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: he-stbc-training
    source: IEEE 802.11ax-2021 27.3.11.2.2/10, Equations 27-55..58; IEEE 802.11-2020 Equation 19-27
    checks: [two_training_symbols, single_stream_pilot_mapping, sparse_training, cyclic_shift, cfo, separate_channels, checked_sample_bounds]
  - name: he-stbc-data
    source: IEEE 802.11ax-2021 27.3.12.5/12/13/16; IEEE 802.11-2020 Table 21-20
    checks: [symbol_pair_combining, pilot_phase_tracking, bcc, ldpc, last_pair_padding, midambles, exact_psdu, aggregate_fcs]
coverage_cases: [wifi-he-stbc-training, wifi-he-stbc-data]
supported_cases:
  - {name: wifi-he-stbc-training, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
  - {name: wifi-he-stbc-data, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Qualification is limited to one DATA stream, two space-time streams, HE20 SU. This does not establish multiple independent DATA streams, other HE formats, live interoperability, throughput, or TX.
