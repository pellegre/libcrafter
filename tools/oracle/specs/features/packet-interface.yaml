version: 1
kind: feature
name: packet_interface
summary: Explicit packet formats and opt-in Wi-Fi capture normalization with retained evidence.
layers: [radiotap, dot11, payload]
directions: [backend_to_libcrafter, libcrafter_to_backend]
strict_bytes: true
malformed: false
behaviors:
  - name: shared-protected-processing
    checks:
      - monitor_and_iq_run_identical_metadata_and_wpa_chains
      - synthetic_handshake_yields_equal_typed_plaintext
      - original_encrypted_capture_survives_transformation
      - missing_keys_authentication_failure_and_replay_remain_distinct
      - repeated_annotation_preserves_decrypt_result
      - driver_decryption_does_not_establish_software_authentication
  - name: independent-interface-vectors
    checks:
      - legacy_and_ht_reference_bytes_cross_opened_packet_wire
      - sample_boundaries_and_duplicate_occurrences_are_preserved
      - partial_transmit_is_not_complete_submission
      - monitor_and_sample_outputs_preserve_typed_packet_overrides
  - name: opened-wifi-interface
    checks:
      - monitor_and_iq_share_packet_source_and_writer_pipeline
      - requested_radio_settings_are_distinct_from_observed_settings
      - unsupported_width_and_phy_settings_return_explicit_errors
      - cancellation_and_terminal_errors_remain_inspectable_after_split
      - receive_restarts_have_distinct_epochs_and_explicit_gaps
      - direction_switches_preserve_queued_samples_and_total_capture_bounds
      - native_callback_storage_outlives_stop_failure_cleanup
      - typed_radio_encoder_overrides_preserve_waveform_controls
      - encoder_phy_matches_shared_requested_phy
      - monitor_reports_unrepresentable_radio_encoder_overrides
  - name: normalized-wifi
    checks:
      - bare_and_radiotap_packets_agree
      - original_capture_bytes_lengths_timestamp_and_link_type_preserved
      - radiotap_fields_and_unknown_fields_retained
      - capture_padding_removed_before_payload_decode
      - fcs_removed_only_with_explicit_presence_evidence
      - unknown_integrity_and_hardware_decryption_remain_unknown
      - truncated_fcs_never_consumes_payload
      - protected_flag_preserved
  - name: monitor-output
    checks:
      - bare_dot11_wrapped_for_driver
      - explicit_radiotap_overrides_preserved
      - incompatible_roots_rejected
  - name: packet-format
    checks:
      - managed_and_ethernet_formats_are_ethernet
      - monitor_and_wifi_iq_formats_are_dot11
      - raw_capture_constructors_preserve_existing_behavior
  - name: radio-codec-boundary
    checks:
      - recovered_link_type_selects_typed_packet_parser
      - codec_declares_trailer_disposition_independently_of_integrity
      - normalized_radio_preserves_original_bytes_and_occurrence_metadata
      - sample_transport_accepts_non_wifi_codec_output
      - packet_byte_counts_are_separate_from_sample_completion
      - live_completion_never_claims_peer_reception
      - monitor_transmit_comparison_reuses_independent_radio_observations
      - receive_qualification_retains_loss_and_matches_only_verified_segments
coverage_cases:
  - crafter-normalized-wifi-equivalence
  - crafter-normalized-wifi-provenance
  - crafter-normalized-wifi-fcs-padding
  - crafter-monitor-driver-framing
  - crafter-radio-codec-contract
  - crafter-interface-protected-fixtures
  - crafter-interface-independent-waveforms
  - scapy-interface-capture-corpus
supported_cases:
  - {name: crafter-normalized-wifi-equivalence, directions: [backend_to_libcrafter, libcrafter_to_backend], byte_policy: strict_bytes, contract_only: true}
  - {name: crafter-normalized-wifi-provenance, directions: [backend_to_libcrafter, libcrafter_to_backend], byte_policy: strict_bytes, contract_only: true}
  - {name: crafter-normalized-wifi-fcs-padding, directions: [backend_to_libcrafter, libcrafter_to_backend], byte_policy: strict_bytes, contract_only: true}
  - {name: crafter-monitor-driver-framing, directions: [backend_to_libcrafter, libcrafter_to_backend], byte_policy: strict_bytes, contract_only: true}
  - {name: crafter-radio-codec-contract, directions: [backend_to_libcrafter, libcrafter_to_backend], byte_policy: strict_bytes, contract_only: true}
  - {name: crafter-interface-protected-fixtures, directions: [backend_to_libcrafter, libcrafter_to_backend], byte_policy: strict_bytes, contract_only: true}
  - {name: crafter-interface-independent-waveforms, directions: [backend_to_libcrafter, libcrafter_to_backend], byte_policy: strict_bytes, contract_only: true}
  - {name: scapy-interface-capture-corpus, directions: [backend_to_libcrafter, libcrafter_to_backend], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: planned
    notes:
      - Deterministic adapter coverage is in crafter/tests/packet_interface.rs.
      - Standard radiotap does not identify hardware decryption; no decryption state is inferred.
      - Independent capture and monitor TX bytes are in crafter/tests/fixtures/dot11/packet-interface-references.json, generated by the Scapy backend materializer.
      - Synthetic WPA handshake and payload fixtures run through the same monitor and IQ transform chain.
