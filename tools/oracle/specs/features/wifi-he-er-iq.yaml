version: 1
kind: feature
name: wifi_he_er_iq
summary: HE ER SU 242-tone and upper106 single-data-stream raw-byte IQ recovery.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: upper106-waveforms
    source: IEEE 802.11ax-2021 27.1.1, 27.3.2.4, Equations27-5/58, Tables27-33/35/36/40/41
    checks: [upper106_allocation, mcs0, fractional_training_scale, four_pilots, bcc, ldpc, dcm, stbc, exact_psdu, midambles, bounded_recovery]
  - name: er-training-and-data
    source: IEEE 802.11ax-2021 27.1.1, 27.3.10, 27.3.11.7/10, 27.3.12.5/8-16, Equations 27-58/108/118-122
    checks: [repeated_header, training_power_normalization, er_data_pilot_offset, exact_data_end, bcc, ldpc, dcm, stbc, midambles, exact_psdu, aggregate_fcs, bounded_streaming, malformed_service, truncated_fields]
coverage_cases: [wifi-he-er-training-and-data, wifi-he-er106-training-and-data]
supported_cases:
  - {name: wifi-he-er-training-and-data, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
  - {name: wifi-he-er106-training-and-data, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - ER242 MCS0-2 and upper106 MCS0, BCC/LDPC, DCM where permitted and one DATA stream including STBC. No live ER interoperability, throughput, or TX qualification.
