version: 1
kind: feature
name: wifi_he_mu_ldpc_payload
summary: Recover per-user MU LDPC PSDU bytes from ordered symbol metrics.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: mu-ldpc-payload
    source: IEEE 802.11ax-2021 27.3.12.4 and 27.3.12.5.3/4
    checks: [exact_psdu, service_validation, post_fec_padding, peer_extra, bounded_metrics, partial_diagnostics]
coverage_cases: [wifi-he-mu-ldpc-payload]
supported_cases:
  - {name: wifi-he-mu-ldpc-payload, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Ordered full-symbol metrics after tone demapping and stream recombination; no MU IQ demodulation or complete streaming integration.
      - Strict recovery requires converged codewords. Partial recovery retains diagnostics but still requires SERVICE and subsequent per-MPDU FCS checks before publication.
