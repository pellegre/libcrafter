version: 1
kind: feature
name: wifi_he_dcm_iq
summary: HE20 SU one-stream DCM joint demapping and BCC/LDPC IQ reception.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: dual-carrier-recovery
    source: IEEE 802.11ax-2021 27.3.12.5.1, 27.3.12.8-10, 27.3.12.15
    checks: [bpsk_sign_parity, qpsk_conjugation, qam16_bit_permutation, weighted_joint_metrics, faded_branch, half_tone_ldpc_permutation, bcc_interleaving, bpsk_filler, mcs_0_1_3_4, valid_guard_training_pairs, midambles, exact_mac_bytes]
coverage_cases: [wifi-he-dcm-iq]
supported_cases:
  - {name: wifi-he-dcm-iq, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - One spatial stream, HE20 SU only. STBC and independent multi-stream reception are separate work.
      - Offline independent IQ qualification is not live RF interoperability or throughput qualification.
