version: 1
kind: feature
name: wifi_receiver_quality
summary: Inspectable OFDM tracking estimates and distinct DATA rejection stages.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: tracking-estimates
    checks: [finite_pilot_phase_residual, signed_sampling_clock_estimate, symbol_count, chunk_invariance]
  - name: data-rejections
    checks: [distinct_header_and_data_failures, no_invalid_delivery]
  - name: signal-recovery
    checks: [retain_original_valid_header, zero_state_tail_fallback, half_guard_fft_fallback, parity_and_length_checks, independent_signal_vectors, corrupted_tail_observations, require_payload_fcs]
  - name: bcc-termination
    checks: [traceback_from_zero_at_tail_end, ignore_pad_observations, recover_psdu_with_erased_tail_observations, retain_mac_integrity_checks]
  - name: pilot-slope-noise
    mcs: [0, 1, 2, 3, 4, 5, 6, 7]
    guard_interval_ns: [400, 800]
    checks: [independent_pilot_tone_interference, both_phase_signs, exact_psdu, valid_fcs, chunk_invariance, retained_clock_tracking]
  - name: data-decision-phase
    mcs: [0, 1, 2, 3, 4, 5, 6, 7]
    guard_interval_ns: [800]
    checks: [independent_noisy_data_and_biased_pilots, both_phase_signs, confidence_weighted_data_phase, exact_psdu, valid_fcs, bounded_iterations, chunk_invariance]
  - name: common-phase-recovery
    mcs: [0, 1, 2, 3, 4, 5, 6, 7]
    guard_interval_ns: [400, 800]
    checks: [independent_antisymmetric_pilot_interference, no_false_clock_correction, both_phase_signs, exact_psdu, valid_fcs, chunk_invariance, unavailable_clock_estimate]
  - name: equalized-pilot-and-bit-metrics
    checks: [retain_sampling_clock_tracking, independent_ht_bcc_matrix, quarter_half_three_quarter_guard_windows, both_guard_intervals, carrier_offset, multipath, full_length_psdu, exact_bytes, valid_fcs]
  - name: integrity-aided-recovery
    checks: [bounded_attempts, retain_original_valid_psdu, retain_valid_aggregate_members, no_overlapping_member_replacement, original_order_and_coordinates, inspectable_retries, no_invalid_delivery]
coverage_cases: [wifi-ofdm-tracking-quality]
supported_cases:
  - {name: wifi-ofdm-tracking-quality, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: supported
    notes:
      - Pilot residual is radians, not calibrated SNR or RF power.
      - Clock estimates require at least two DATA symbols; unavailable estimates remain explicit.
      - Rust clock-matrix tests verify long-frame estimates within 2 ppm and finite pilot residuals.
      - Independent malformed SIGNAL, SERVICE and FCS fixtures distinguish rejection stages.
      - BCC traceback ends at the six zero TAIL bits, before PAD, using the known zero encoder state (IEEE 802.11-2020 17.3.5.3 and 19.3.11.1).
      - Independent coded legacy fixtures cover every OFDM rate with erased TAIL observations and contradictory PAD observations; HT uses the same BCC recovery path.
      - Independent HT pilot-tone interference fixtures verify that per-symbol slope noise does not rotate otherwise valid DATA constellations.
