version: 1
kind: feature
name: wifi_receiver_quality
summary: Inspectable OFDM tracking estimates and distinct DATA rejection stages.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: tracking-estimates
    checks: [finite_pilot_phase_residual, signed_sampling_clock_estimate, symbol_count, chunk_invariance]
  - name: data-rejections
    checks: [distinct_header_and_data_failures, no_invalid_delivery]
  - name: bcc-termination
    checks: [traceback_from_zero_at_tail_end, ignore_pad_observations, recover_psdu_with_erased_tail_observations, retain_mac_integrity_checks]
coverage_cases: [wifi-ofdm-tracking-quality]
supported_cases:
  - {name: wifi-ofdm-tracking-quality, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: supported
    notes:
      - Pilot residual is radians, not calibrated SNR or RF power.
      - Clock estimates require at least two DATA symbols; unavailable estimates remain explicit.
      - Rust clock-matrix tests verify long-frame estimates within 2 ppm and finite pilot residuals.
      - Independent malformed SIGNAL, SERVICE and FCS fixtures distinguish rejection stages.
      - BCC traceback ends at the six zero TAIL bits, before PAD, using the known zero encoder state (IEEE 802.11-2020 17.3.5.3 and 19.3.11.1).
      - Independent coded legacy fixtures cover every OFDM rate with erased TAIL observations and contradictory PAD observations; HT uses the same BCC recovery path.
