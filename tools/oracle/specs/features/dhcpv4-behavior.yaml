version: 1
kind: feature
name: dhcpv4_behavior
summary: DHCP message matrix and option list behavior over BOOTP.

# DHCP message and option behavior rides on the IP-layer stack and does not
# depend on Ethernet framing. Listing ipv4/udp/dhcpv4 lets this feature match both
# the Ethernet-root stack (ethernet/ipv4/udp/dhcpv4) and the IPv4-root live stack
# (ipv4/udp/dhcpv4) without requiring link-layer authoring.
layers:
  - ipv4
  - udp
  - dhcpv4
directions:
  - backend_to_libcrafter
  - libcrafter_to_backend
strict_bytes: true
malformed: false

behaviors:
  - name: discover
    message_types:
      - discover
  - name: request_offer_ack
    message_types:
      - request
      - offer
      - ack
  - name: inform_release
    message_types:
      - inform
      - release
  - name: decline_nak
    message_types:
      - decline
      - nak
  - name: force_renew
    message_types:
      - force_renew
  - name: lease_query
    message_types:
      - lease_query
  - name: option_matrix
    option_kinds:
      - message_type
      - hostname
      - domain_name
      - requested_ip
      - server_id
      - parameter_request_list
      - lease_time
      - router
      - dns_server
      - vendor_class
      - client_identifier
      - classless_static_route
      - relay_agent
      - generic
      - end

coverage_cases:
  - dhcpv4-discover
  - dhcpv4-request-offer-ack
  - dhcpv4-inform-release-generic-options
  - dhcpv4-decline-nak
  - dhcpv4-force-renew
  - dhcpv4-lease-query
  - dhcpv4-option-matrix
  - malformed-dhcpv4-options
  - crafter-dhcpv4-message-matrix

backend_support:
  scapy:
    status: supported
    native_layers:
      - BOOTP
      - DHCP
    notes:
      - Strict-byte reference coverage spans the IANA DHCP message-type matrix
        (discover, offer, request, decline, ack, nak, release, inform,
        force_renew, lease_query) plus the Scapy-representable option domains.
      - Scapy does not byte-encode option_overload, rfc3396 long options, typed
        relay_agent sub-option registries, RFC 4361 client identifiers,
        authentication, or leasequery time/status/state options; those are
        covered by native libcrafter fixtures, not this reference backend.
  libcrafter:
    status: supported
    notes:
      - Decodes and re-encodes the full DHCPv4 message-type matrix and the
        registered option formats from steps 01-17, including option_overload,
        rfc3396 long-option concatenation, classless_static_route (121),
        relay_agent option 82 sub-options, client_identifier (61), and
        leasequery (91/92/151-157).
