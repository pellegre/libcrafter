version: 1
kind: feature
name: wifi_he_mu_capacity
summary: HE20 per-user MU payload bit and byte budgets.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: mu-capacity
    source: IEEE 802.11ax-2021 Table 27-33, 27.3.12.5.1 and Equations 27-144 through 27-147
    checks: [per_user_mcs_and_coding, ru_sizes, dcm26_short_two, conditional_bcc_filler, ldpc_extra_per_user, stbc_groups, invalid_bounds, su_er_compatibility]
coverage_cases: [wifi-he-mu-capacity]
supported_cases:
  - {name: wifi-he-mu-capacity, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Uses verified per-user SIG-B fields and global MU padding/STBC signaling. Does not establish timing, spatial consistency across users, LDPC puncturing admission, or MAC integrity.
      - 26-tone DCM short segments use two data tones, not half of six. The BCC BPSK/DCM filler applies only to 106/242-tone RUs with one spatial stream.
