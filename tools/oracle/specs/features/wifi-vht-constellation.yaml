version: 1
kind: feature
name: wifi_vht_constellation
summary: VHT 256-QAM soft-bit demapping with source-defined labels and normalization.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: constellation-metrics
    source: IEEE 802.11-2020 21.3.10.9.1 Figures 21-24 through 21-27
    checks: [all_256_labels, normalization_170, independent_label_table, off_grid_soft_metrics, channel_weight_scaling, zero_weight_erasure, lower_order_mapping_unchanged, invalid_modulation_dimensions]
coverage_cases: [wifi-vht-256qam]
supported_cases:
  - {name: wifi-vht-256qam, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Constellation metrics alone do not establish VHT DATA recovery or live qualification.
      - All 256 ideal labels and 145 off-grid soft-metric cases pass at four channel weights, with invalid-dimension and lower-order mapping checks.
