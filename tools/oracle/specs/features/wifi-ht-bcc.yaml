version: 1
kind: feature
name: wifi_ht_bcc
summary: Independent HT20 single-stream BCC payload recovery matrix.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: ht20-bcc-matrix
    mcs: [0, 1, 2, 3, 4, 5, 6, 7]
    guard_interval_ns: [400, 800]
    lengths: [100, 4095]
    impairments: [clean, carrier_offset_and_multipath]
    checks: [independent_iq, ht_channel_estimate, pilot_rotation, deinterleaving, puncturing, exact_psdu, valid_fcs]
coverage_cases: [wifi-ht20-bcc]
supported_cases:
  - {name: wifi-ht20-bcc, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - WifiDecoder recovers exact FCS-valid bytes in 64 independent IQ cases at three chunk sizes.
      - Truncated training and DATA, unusable pilots, payload bounds and nonzero source coordinates are tested.
      - This matrix does not qualify LDPC, STBC, aggregation, greenfield or live operation.
