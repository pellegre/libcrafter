version: 1
kind: feature
name: wifi_he_demapping
summary: HE 1024-QAM metrics and 242-tone non-DCM LDPC inverse tone mapping.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: constellation
    source: IEEE 802.11ax-2021 27.3.12.9 Figures27-37-40
    checks: [all_1024_labels, normalization_682, independent_max_log_metrics, off_grid_points, channel_weights, lower_order_unchanged]
  - name: ldpc-tones
    source: IEEE 802.11ax-2021 27.3.12.10 Table27-36 Equation27-95
    checks: [all_234_data_tones, constellation_bit_groups_preserved, supported_modulation_widths, input_bounds, nonfinite_rejection]
coverage_cases: [wifi-he-demapping]
supported_cases:
  - {name: wifi-he-demapping, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Private metric primitives; separate wifi_he_ldpc_iq fixtures qualify complete-waveform integration.
      - Inverse LDPC tone mapping is for one already separated non-DCM 242-tone RU stream, not DCM or multi-stream reception.
