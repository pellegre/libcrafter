version: 1
kind: feature
name: wifi_he_tb_data_iq
summary: Explicit Trigger-configured isolated HE20 TB user IQ to PSDU kernel.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: tb-user-iq
    source: IEEE 802.11ax-2021 27.3.10, 27.3.11.10, 27.3.12.5.5, Equation 27-111
    checks: [matching_trigger_fields, bounded_timing, isolated_ru_training, per_user_pilot_phase, bcc_ldpc_psdu, midamble_refresh, service_integrity]
coverage_cases: [wifi-he-tb-data-iq]
supported_cases:
  - {name: wifi-he-tb-data-iq, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Isolated per-user kernel is checked against 282 independent waveforms, including SERVICE rejection and sample/payload bounds.
      - Explicit caller-established Trigger association and isolated one-DATA-stream user context are required. No spatial separation or automatic exchange matching is inferred.
      - PSDU recovery is separate from aggregate MPDU FCS checks and streaming publication.
