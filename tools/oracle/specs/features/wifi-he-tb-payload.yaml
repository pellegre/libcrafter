version: 1
kind: feature
name: wifi_he_tb_payload
summary: Trigger-configured HE20 per-user BCC and LDPC soft-metric payload recovery.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: tb-payload
    source: IEEE 802.11ax-2021 27.3.12.4, 27.3.12.5.1 and 27.3.12.5.5
    checks: [trigger_coding_dispatch, bcc_puncturing, dcm_filler, ldpc_explicit_extra, service_validation, post_fec_padding, bounded_partial_codewords, finite_metrics, allocation_limits, independent_payload_bytes]
coverage_cases: [wifi-he-tb-payload]
supported_cases:
  - {name: wifi-he-tb-payload, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Kernels consume per-user tone-demapped and stream-recombined metrics with explicit Trigger Common/User fields. No Trigger association or IQ demodulation is inferred.
      - SERVICE is mandatory; partial LDPC estimates retain failure accounting and require downstream per-MPDU FCS validation before publishing a frame.
