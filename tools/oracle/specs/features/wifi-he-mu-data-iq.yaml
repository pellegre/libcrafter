version: 1
kind: feature
name: wifi_he_mu_data_iq
summary: HE20 MU single-stream RU IQ to per-user PSDUs.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: mixed-user-padding
    source: IEEE 802.11ax-2021 27.3.12.5.4 equations 27-81 through 27-89
    checks: [per_user_modulation, per_user_fec, common_extra_segment, initial_ldpc_padding, final_bcc_padding]
  - name: mu-data-iq
    source: IEEE 802.11ax-2021 27.3.11.8/10 and 27.3.12
    checks: [checked_sig_b, per_user_positions, ru_training, mu_timing, bcc, ldpc, dcm, service, bounded_stbc_decision_refinement, bounds]
coverage_cases: [wifi-he-mu-data-iq]
supported_cases:
  - {name: wifi-he-mu-data-iq, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - One DATA stream per RU with optional STBC. Preserves per-user failures. PSDUs require MAC/FCS verification in the streaming publication path; MU-MIMO spatial separation remains unsupported.
