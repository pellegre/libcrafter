version: 1
kind: feature
name: wifi_eht_ofdma_ru
summary: EHT20 OFDMA allocation geometry and ordered RU/MRU ownership.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: twenty-mhz-allocation-map
    source: IEEE 802.11be-2024 Table 36-34; IEEE 802.11 TGbe 11-21/1153r2, 11-21/1987r1 and 11-23/1377r1
    checks: [ordinary_indices_0_through_25, small_mru_indices_32_through_55, increasing_frequency_order, derived_user_count, reserved_indices]
  - name: resource-tone-geometry
    source: IEEE 802.11be-2024 Tables 36-4 and 36-34; IEEE 802.11 TGbe 11-21/1987r1 Figure 36-10
    checks: [ru26, ru52, ru106, ru242, mru52_plus_26, mru106_plus_26, disjoint_resources, occupied_tone_count]
coverage_cases: [wifi-eht-ofdma-ru]
supported_cases:
  - {name: wifi-eht-ofdma-ru, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: supported
    notes:
      - The signaling parser exposes ordered 20 MHz RU/MRU components, tone ownership, and resource-derived User-field layouts.
      - Wider-than-20-MHz allocation combinations and overlapping MU-MIMO spatial separation are outside this contract.
