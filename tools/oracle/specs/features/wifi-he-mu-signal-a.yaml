version: 1
kind: feature
name: wifi_he_mu_signal_a
summary: HE MU SIG-A bit and interleaved soft-metric decoding.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: mu-header-fields
    source: IEEE 802.11ax-2021 Table 27-20 and 27.3.11.7.3-4
    checks: [independent_crc_bcc_interleaver, field_mapping, doppler_ltf_count, raw_sig_b_count, crc_tail_reserved_rejection, finite_metric_bounds]
coverage_cases: [wifi-he-mu-signal-a]
supported_cases:
  - {name: wifi-he-mu-signal-a, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Header kernel only; caller must establish MU format. No MU DATA admission or live qualification.
      - The raw SIG-B symbol/user count is retained. Uncompressed value 15 is not assumed to mean exactly 16 symbols.
      - Raw spatial-reuse codes are preserved, including reserved codes, rather than interpreted as permissions.
