version: 1
kind: feature
name: wifi_he_bcc_iq
summary: HE20 SU one-stream BCC payload recovery from acquired IQ.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: bounded-header-admission
    source: IEEE 802.11ax-2021 Equations27-119-122/140-143
    checks: [prefix_only_admission, exact_data_start_and_end, exact_psdu_capacity, sample_budget, byte_budget, absolute_position_overflow, unsupported_modes_before_training]
  - name: su-bcc-iq
    source: IEEE 802.11ax-2021 27.3.12.8/9/13/14, Tables27-35/42/43, Equations27-104/108
    checks: [independent_complete_preamble, all_bcc_mcs, all_su_training_guards, pilot_polarity_offset_four, rotating_eight_pilots, channel_weighted_qam, interleaving, exact_psdu_bytes, truncation, invalid_mode_rejection]
coverage_cases: [wifi-he-su-bcc-iq]
supported_cases:
  - {name: wifi-he-su-bcc-iq, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - One-stream non-DCM, non-STBC, no-midamble BCC IQ cases. Separate wifi_he_ldpc_iq cases qualify LDPC integration; other layouts remain unsupported.
      - Raw PSDU recovery does not establish MAC aggregate/FCS admission, public streaming publication or live hardware qualification.
      - Header-only admission returns the exact DATA reservation from the acquired L-SIG position; packet extension is not required for byte recovery. Admission does not assert payload integrity.
