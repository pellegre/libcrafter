version: 1
kind: feature
name: wifi_he_mu_stream
summary: Bounded HE20 MU DATA streaming and per-user FCS-qualified aggregates.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: mu-stbc-stream
    source: IEEE 802.11ax-2021 27.3.11.10 and 27.3.12.12-14
    checks: [one_stream_two_sts_per_ru, ltf_count_admission, paired_data, shared_pilot_tracking, distinct_ru_mapping, bcc_ldpc, midamble_refresh, branch_loss, full_mac_fcs, chunking, truncation]
  - name: mu-stream
    source: IEEE 802.11ax-2021 27.3 and 26.6.2
    checks: [sig_b_data_handoff, user_positions, user_aware_duplicates, fcs_publication, bad_fcs_salvage, partial_ldpc, chunking, buffer_bounds, output_bounds, eof_gap, legacy_opt_out]
coverage_cases: [wifi-he-mu-stream]
supported_cases:
  - {name: wifi-he-mu-stream, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - One DATA stream per RU, optionally encoded on two STS with STBC. MU-MIMO and multiple independent DATA streams remain unsupported. Complete-MAC waveforms are offline evidence, not live HE qualification.
