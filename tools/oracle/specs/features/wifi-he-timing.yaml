version: 1
kind: feature
name: wifi_he_timing
summary: HE20 SU DATA and midamble boundaries from integrity-checked signaling.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: su-duration-inversion
    source: IEEE 802.11ax-2021 Table 27-12, 27.3.11.10, 27.3.12.12/16, Equations 27-11/112/118-122
    checks: [ltf_count, all_su_guard_pairs, midamble_periods, no_final_single_symbol_midamble, pe_disambiguity, pe_rounding, stbc_grouping, checked_symbol_offsets, independent_forward_timing]
coverage_cases: [wifi-he-su-timing]
supported_cases:
  - {name: wifi-he-su-timing, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Private nonempty HE20 SU timing only. Does not admit MCS/FEC combinations, decode DATA, estimate midamble channels, or qualify multiple-stream reception. Sounding NDP, ER SU, MU and TB timing are not handled here.
      - Sample offsets exclude the optional signal extension and distinguish exact PE end from L-SIG rounded duration.
