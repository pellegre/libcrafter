version: 1
kind: feature
name: dhcpv6_behavior
summary: DHCPv6 message, relay, identity association, and option behavior.

layers:
  - ipv6
  - udp
  - dhcpv6
directions:
  - backend_to_libcrafter
  - libcrafter_to_backend
strict_bytes: true
malformed: false

behaviors:
  - name: solicit
    message_types:
      - solicit
  - name: request
    message_types:
      - request
  - name: reply
    message_types:
      - reply
  - name: information_request
    message_types:
      - information_request
  - name: information_reply
    message_types:
      - reply
  - name: relay_forward
    message_types:
      - relay_forward
  - name: relay_reply
    message_types:
      - relay_reply
  - name: ia_na_iaaddr
    option_kinds:
      - ia_na
      - ia_addr
  - name: ia_pd_iaprefix
    option_kinds:
      - ia_pd
      - ia_prefix
  - name: unknown_option
    option_kinds:
      - unknown
  - name: option_matrix
    option_kinds:
      - client_id
      - server_id
      - oro
      - elapsed_time
      - status_code
      - ia_na
      - ia_addr
      - ia_pd
      - ia_prefix
      - relay_msg
      - interface_id
      - unknown

supported_cases:
  - name: dhcpv6-solicit
    directions:
      - backend_to_libcrafter
      - libcrafter_to_backend
    byte_policy: strict_bytes
  - name: dhcpv6-request
    directions:
      - backend_to_libcrafter
      - libcrafter_to_backend
    byte_policy: strict_bytes
  - name: dhcpv6-reply
    directions:
      - backend_to_libcrafter
      - libcrafter_to_backend
    byte_policy: strict_bytes
  - name: dhcpv6-information-request
    directions:
      - backend_to_libcrafter
      - libcrafter_to_backend
    byte_policy: strict_bytes
  - name: dhcpv6-information-reply
    directions:
      - backend_to_libcrafter
      - libcrafter_to_backend
    byte_policy: strict_bytes
  - name: dhcpv6-relay-forward
    directions:
      - backend_to_libcrafter
      - libcrafter_to_backend
    byte_policy: strict_bytes
  - name: dhcpv6-relay-reply
    directions:
      - backend_to_libcrafter
      - libcrafter_to_backend
    byte_policy: strict_bytes
  - name: dhcpv6-ia-na-iaaddr
    directions:
      - backend_to_libcrafter
      - libcrafter_to_backend
    byte_policy: strict_bytes
  - name: dhcpv6-ia-pd-iaprefix
    directions:
      - backend_to_libcrafter
      - libcrafter_to_backend
    byte_policy: strict_bytes
  - name: dhcpv6-unknown-option
    directions:
      - backend_to_libcrafter
      - libcrafter_to_backend
    byte_policy: strict_bytes
  - name: dhcpv6-option-matrix
    directions:
      - backend_to_libcrafter
      - libcrafter_to_backend
    byte_policy: strict_bytes

coverage_cases:
  - dhcpv6-solicit
  - dhcpv6-request
  - dhcpv6-reply
  - dhcpv6-information-request
  - dhcpv6-information-reply
  - dhcpv6-relay-forward
  - dhcpv6-relay-reply
  - dhcpv6-ia-na-iaaddr
  - dhcpv6-ia-pd-iaprefix
  - dhcpv6-unknown-option
  - dhcpv6-option-matrix

backend_support:
  scapy:
    status: supported
    native_layers:
      - DHCP6
    notes:
      - Scapy DHCP6 layers cover the offline message, relay, identity
        association, and unknown-option cases.
  libcrafter:
    status: supported
    notes:
      - The crate supports the message, relay, identity association, and unknown
        option cases listed here through typed builders and decode.
  wireshark:
    status: supported
    decode: true
    pcap_read: true
    notes:
      - Parser-only pcap reads normalize DHCPv6 message, relay, identity
        association, status, DUID, and unknown-option bytes for comparison.
