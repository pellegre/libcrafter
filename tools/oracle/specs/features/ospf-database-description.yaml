version: 1
kind: feature
name: ospf_database_description
summary: >-
  OSPFv2 Database Description packet framing over IPv4 (IP protocol 89),
  covering the RFC 2328 Section A.3.3 interface MTU, options, I/M/MS flags, DD
  sequence number, and the trailing LSA-header list layered on the common
  header, with strict-byte equivalence between the Scapy reference backend and
  libcrafter in both offline directions.

layers:
  - ospf
  - ipv4
directions:
  - reference_to_libcrafter
  - libcrafter_to_reference
strict_bytes: true
malformed: false

behaviors:
  - name: common_header_fields
    rfc:
      - RFC 2328 Section A.3.1
    message_type: database_description
    checks:
      - version_2
      - type_is_database_description
      - packet_length_covers_packet
      - router_id_preserved
      - area_id_preserved
  - name: database_description_fields
    rfc:
      - RFC 2328 Section A.3.3
    message_type: database_description
    checks:
      - interface_mtu_preserved
      - options_preserved
      - init_more_master_flags_preserved
      - dd_sequence_number_preserved
      - lsa_header_list_round_trips

coverage_cases:
  - ospf-database-description

supported_cases:
  - name: ospf-database-description
    directions:
      - reference_to_libcrafter
      - libcrafter_to_reference
    byte_policy: strict_bytes

backend_support:
  scapy:
    status: supported
    native_layers:
      - OSPF_Hdr
      - OSPF_DBDesc
    encode: true
    decode: true
    notes:
      - Scapy 2.7.0 natively round-trips the OSPFv2 common header (OSPF_Hdr) and
        the Database Description body (OSPF_DBDesc), including the interface MTU,
        options, the I/M/MS flags, the DD sequence number, and the trailing
        LSA-header list, via scapy.contrib.ospf.
  libcrafter:
    status: supported
    encode: true
    decode: true
    notes:
      - Database Description compile derives the RFC 2328 packet length and the
        common-header checksum unless the caller deliberately overrides them;
        decode preserves the MTU, options, flags, DD sequence number, and the
        LSA-header list so the packet round-trips byte-for-byte.
