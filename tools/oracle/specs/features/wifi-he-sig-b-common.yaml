version: 1
kind: feature
name: wifi_he_sig_b_common
summary: HE20 SIG-B common-field validation and resource allocation mapping.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: common-allocation
    source: IEEE 802.11ax-2021 Tables 27-24/26 and 27.3.11.7.3
    checks: [all_256_codepoints, ordered_ru_geometry, per_ru_user_count, empty_ru_preservation, reserved_vs_wider, crc_tail_validation, bit_bounds, independent_common_fields]
coverage_cases: [wifi-he-sig-b-common]
supported_cases:
  - {name: wifi-he-sig-b-common, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Common-field bit kernel only; caller establishes 20 MHz and uncompressed SIG-B context. No SIG-B IQ demodulation or MU DATA admission yet.
      - RU positions use the first slot in Table 27-26 (1 through 9), not FFT-bin indices. Empty central RUs are retained with zero users.
      - The table's printed decimal range 72-29 is interpreted using its unambiguous binary prefix 01001yyy, meaning 72 through 79.
