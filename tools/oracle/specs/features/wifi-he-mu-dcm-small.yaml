version: 1
kind: feature
name: wifi_he_mu_dcm_small
summary: Joint DCM metrics for 26- and 52-tone HE20 resource units.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: small-ru-dcm
    source: IEEE 802.11ax-2021 27.3.12.9
    checks: [half12, half24, even_half_bpsk_sign, qpsk_conjugation, qam16_bit_swap, independent_distances, erasures, bounds]
coverage_cases: [wifi-he-mu-dcm-small]
supported_cases:
  - {name: wifi-he-mu-dcm-small, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Demapper accepts twelve- and twenty-four-data-tone halves. Does not establish RU admission, channel recovery or complete MU IQ decoding.
