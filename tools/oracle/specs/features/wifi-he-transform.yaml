version: 1
kind: feature
name: wifi_he_transform
summary: Fixed-size natural-order HE receive transforms at 20Msps.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: false
behaviors:
  - name: he128-he256-transform
    source: IEEE 802.11ax-2021 Table 27-12 and 27.3.11.10
    checks: [natural_bin_order, negative_frequency, unnormalized_forward, independent_direct_dft, fixed_storage]
coverage_cases: [wifi-he-transform]
supported_cases:
  - {name: wifi-he-transform, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Mathematical receive primitives, not HE channel training, DATA recovery or hardware qualification. Floating outputs use explicit error tolerances rather than bitwise equality to the double-precision oracle.
