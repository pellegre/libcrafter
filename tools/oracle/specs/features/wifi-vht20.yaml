version: 1
kind: feature
name: wifi_vht20
summary: Single-user VHT20 packet signaling, RX and TX.
layers: [dot11]
directions: [backend_to_libcrafter, libcrafter_to_backend]
strict_bytes: true
malformed: true
behaviors:
  - name: vht20-signaling
    checks: [sig_a_crc, sig_b_service_crc, reserved_fields, tail_bits, su_mu_context, ndp]
  - name: vht20-waveforms
    mcs: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    guard_interval_ns: [400, 800]
    coding: [bcc, ldpc]
    checks: [independent_iq, exact_mpdu, valid_fcs, sample_coordinates, padding, aggregation]
  - name: vht20-bounds
    checks: [truncation, sample_gaps, buffer_limits, output_limits, explicit_overrides]
coverage_cases: [wifi-vht20]
supported_cases:
  - {name: wifi-vht20, directions: [backend_to_libcrafter, libcrafter_to_backend], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - VHT20 SU RX and TX cover MCS0-8, both guard intervals, BCC and LDPC.
      - 235 independent receive waveforms and 11 rejection controls check exact MPDUs.
      - One-data-stream VHT STBC, MU and wider channels are outside this contract.
      - Hardware qualification is external to the deterministic contract.
