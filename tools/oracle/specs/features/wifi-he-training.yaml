version: 1
kind: feature
name: wifi_he_training
summary: HE20 SU one-stream HE-LTF channel estimation from independently acquired IQ.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: he-su-4x-training
    source: IEEE 802.11ax-2021 27.3.11.9-10, Equations 27-22/23/38/43/55-58
    checks: [source_training_sequence, both_4x_guard_intervals, prefix_acquisition, cfo, multipath, beam_change, zero_channel_rejection, checked_sample_bounds]
  - name: he-su-sparse-training
    source: IEEE 802.11ax-2021 Table 27-31, Equations 27-5/41/42/58
    checks: [sparse_source_sequences, short_transform_normalization, fractional_ltf_normalization_not_populated_tone_count, all_su_guard_combinations, complex_channel_interpolation, channel_probe_signs]
coverage_cases: [wifi-he-su-4x-training, wifi-he-su-sparse-training]
supported_cases:
  - {name: wifi-he-su-4x-training, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
  - {name: wifi-he-su-sparse-training, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Sparse training uses regularized finite-delay least-squares channel estimation. Separate wifi_he_stbc_iq cases qualify two-STS training. Multiple independent DATA streams and live qualification remain unfinished. Probe symbols are mathematical channel checks, not valid MAC frames; the finite-delay estimator is not exact recovery for arbitrary channels.
