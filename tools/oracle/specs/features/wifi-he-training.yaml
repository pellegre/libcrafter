version: 1
kind: feature
name: wifi_he_training
summary: HE20 SU one-stream 4x HE-LTF channel estimation from independently acquired IQ.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: he-su-4x-training
    source: IEEE 802.11ax-2021 27.3.11.9-10, Equations 27-22/23/38/43/55-58
    checks: [source_training_sequence, both_4x_guard_intervals, prefix_acquisition, cfo, multipath, beam_change, zero_channel_rejection, checked_sample_bounds]
coverage_cases: [wifi-he-su-4x-training]
supported_cases:
  - {name: wifi-he-su-4x-training, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Private one-stream4x training only. Sparse1x/2x interpolation, STBC/multi-stream training, DATA recovery and live qualification remain unfinished. Probe symbols are mathematical channel checks, not valid MAC frames.
