version: 1
kind: feature
name: wifi_he_tb_training
summary: Trigger-configured isolated HE20 RU training for one DATA stream and STBC.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: tb-training
    source: IEEE 802.11ax-2021 Table 27-31 and Equations 27-55 through 27-59
    checks: [trigger_ltf_guard_mapping, ofdma_ltf_count, full_ru_ltf_count, single_stream_pilots, stbc_channels, per_ru_phase, reject_ofdma_one_x_ltf, reject_masked_mode, isolated_ru_reference_channels]
coverage_cases: [wifi-he-tb-training]
supported_cases:
  - {name: wifi-he-tb-training, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Isolated RU training kernels use explicit Trigger fields and caller-established positions/acquisition. Shared independent isolated-RU fixtures qualify equivalent per-user normalization.
      - Only 2x1600 and 4x3200 single-stream-pilot modes are admitted here; 1x1600 is full-bandwidth UL MU-MIMO, not OFDMA.
      - No Trigger association, simultaneous-user CFO acquisition, TB DATA demodulation or live qualification is implied.
