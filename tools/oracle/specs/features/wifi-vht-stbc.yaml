version: 1
kind: feature
name: wifi_vht_stbc
summary: VHT20 SU one-data-stream two-space-time-stream receive contract.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: vht20-stbc-receive
    source: IEEE 802.11-2020 21.3.8.3.5-6, 21.3.10.9.4 and 21.3.10.10
    checks: [two_ltf_data_columns, common_training_pilots, composite_sig_b, vht_data_pilots, paired_symbols, bcc_ldpc, both_guard_intervals, exact_mpdu, independent_iq]
coverage_cases: [wifi-vht20-stbc-iq]
supported_cases:
  - {name: wifi-vht20-stbc-iq, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - This receive-only slice does not qualify VHT MU, independent multiple DATA streams, live reception or single-antenna STBC transmission.
