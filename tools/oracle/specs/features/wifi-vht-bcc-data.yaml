version: 1
kind: feature
name: wifi_vht_bcc_data
summary: Single-encoder VHT BCC DATA recovery and SIG-B SERVICE binding.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: vht-data-layout
    source: IEEE 802.11-2020 21.3.10.1-5 and 21.4.3 Equation 21-112
    checks: [service_sig_b_crc, nonzero_scrambler_seed, phy_padding_before_tail, terminal_zero_state, exact_psdu_length, all_four_bcc_rates, independent_coded_bits, malformed_dimensions, finite_metrics, erased_metrics, metric_scaling]
coverage_cases: [wifi-vht-bcc-data]
supported_cases:
  - {name: wifi-vht-bcc-data, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - DATA bit recovery does not establish IQ acquisition, aggregate framing, MPDU integrity or live qualification.
      - 316 independent cases cover 289 valid payloads and 27 invalid SERVICE/seed cases, all nonzero seeds, all four rates, metric scaling/erasures, and payloads up to 58965 bytes.
