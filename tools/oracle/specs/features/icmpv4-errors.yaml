version: 1
kind: feature
name: icmpv4_errors
summary: ICMPv4 error variants with embedded IPv4 header prefixes and RFC 4884 extensions.

layers:
  - ipv4
  - icmp
directions:
  - reference_to_libcrafter
  - libcrafter_to_reference
strict_bytes: true
malformed: false

behaviors:
  - name: destination_unreachable
    icmp_type: destination_unreachable
    embeds:
      - ipv4
      - payload_prefix
  - name: time_exceeded
    icmp_type: time_exceeded
    embeds:
      - ipv4
      - payload_prefix
  - name: parameter_problem
    icmp_type: parameter_problem
    embeds:
      - ipv4
      - payload_prefix
  - name: redirect
    icmp_type: redirect
    embeds:
      - ipv4
      - payload_prefix
  - name: frag_needed_next_hop_mtu
    icmp_type: destination_unreachable
    embeds:
      - ipv4
      - payload_prefix
  - name: mpls_extension
    icmp_type: destination_unreachable
    embeds:
      - icmp_extension_header
      - icmp_extension_mpls
  - name: interface_info_extension
    icmp_type: destination_unreachable
    embeds:
      - icmp_extension_header
      - icmp_extension_object

coverage_cases:
  - icmpv4-destination-unreachable
  - icmpv4-time-exceeded
  - icmpv4-parameter-problem
  - icmpv4-redirect
  - icmpv4-frag-needed-next-hop-mtu
  - icmpv4-extensions-mpls
  - icmpv4-extensions-interface-info
  - crafter-icmpv4-errors-extensions

backend_support:
  scapy:
    status: supported
    native_layers:
      - ICMP
      - ICMPExtensionHeader
      - ICMPExtensionMPLS
  libcrafter:
    status: partial
    notes:
      - The libcrafter_to_reference vectors (crafter-icmpv4-errors-extensions) are typed and pass byte-for-byte; they quote the original IPv4 datagram as IcmpQuotedIpv4, type RFC 1191 next-hop MTU, and decode RFC 4884/4950 extension and MPLS objects.
      - The reference_to_libcrafter generator path is still partial because the seeded ICMP error sampler emits a flat ipv4/icmp/payload stack rather than a structured quoted datagram; scapy and libcrafter normalize that opaque tail differently, so it is not yet a byte-equal generator case.
      - RFC 5837 interface information objects are typed by libcrafter; the reference backend has no native object class, so they are validated libcrafter-side and remain raw-compatible against the reference.
