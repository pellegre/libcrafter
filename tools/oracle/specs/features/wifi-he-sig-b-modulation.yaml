version: 1
kind: feature
name: wifi_he_sig_b_modulation
summary: Equalized HE SIG-B tone demapping, PAPR derotation, DCM combining and BCC deinterleaving.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: modulation
    source: IEEE 802.11ax-2021 Equation 27-21, Table 27-35, 27.3.12.9 and Table 27-111
    checks: [all_mcs_dcm_pairs, phase_rotation_exception, interleaver_permutations, independent_streams, coded_block_integration, erased_half, finite_metrics, bounds]
coverage_cases: [wifi-he-sig-b-modulation]
supported_cases:
  - {name: wifi-he-sig-b-modulation, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Private equalized-tone kernel. Exactly 52 data tones in ascending signed-subcarrier order, excluding DC and pilots.
      - Removes SIG-B PAPR rotation before DCM joint demapping; BPSK with DCM is exempt from that rotation.
      - DCM uses 26-tone halves, not the 51/117-tone halves of HE DATA.
      - Independent modulated streams connect to the coded-block and checked-header readers. FFT and IQ integration have separate contracts; MU DATA remains pending.
