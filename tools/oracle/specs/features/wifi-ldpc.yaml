version: 1
kind: feature
name: wifi_ldpc
summary: IEEE HT LDPC matrix and bounded soft-codeword recovery contract.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: ldpc-matrices
    source: IEEE 802.11-2020 19.3.11.7.4 and Annex F
    lengths: [648, 1296, 1944]
    rates: [1/2, 2/3, 3/4, 5/6]
    checks: [independent_gaussian_parity, exact_syndrome, complete_dimensions]
  - name: ldpc-soft-decoding
    checks: [exact_information_bits, bounded_iterations, correction, nonconvergence, metric_dimensions, finite_metrics]
coverage_cases: [wifi-ldpc-codewords]
supported_cases:
  - {name: wifi-ldpc-codewords, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Internal codeword decoder covers all twelve matrices with a maximum of 64 iterations.
      - Thirty-six independent systematic codewords pass clean and eight low-confidence error cases.
      - Codeword validation alone does not qualify rate matching or complete IQ decoding.
