version: 1
kind: feature
name: wifi_vht_ldpc
summary: VHT20 SU LDPC rate-matching geometry with explicit signaling consistency.
layers: [dot11]
directions: [backend_to_libcrafter]
strict_bytes: true
malformed: true
behaviors:
  - name: vht20-su-ldpc-geometry
    source: IEEE 802.11-2020 21.3.10.5.4 Equations 21-61 through 21-63 and 19.3.11.7.5
    checks: [encoded_phy_padding, extra_symbol_flag, symbol_grouping, bounded_dimensions, shortening, puncturing, repetition, independent_geometry, exact_recovery]
coverage_cases: [wifi-vht20-ldpc-rate]
supported_cases:
  - {name: wifi-vht20-ldpc-rate, directions: [backend_to_libcrafter], byte_policy: strict_bytes, contract_only: true}
backend_support:
  libcrafter:
    status: partial
    notes:
      - Independent forward geometry covers 20412 cases and Gaussian parity encoding supplies 54 exact recovery bitstreams.
      - This increment covers internal SU rate matching only, not complete LDPC IQ reception or hardware qualification.
      - VHT LDPC tone mapping, SERVICE validation and streaming admission remain separate integration requirements.
