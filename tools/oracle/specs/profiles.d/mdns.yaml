version: 1
kind: profiles
name: mdns_profiles

profiles:
  - name: mdns-smoke
    purpose: focused offline mDNS UDP/5353 query, response, and DNS-SD smoke coverage
    default_count: 12
    family_weights:
      - name: mdns
        weight: 1
    payload_length:
      min: 0
      max: 0
    feature_weights:
      baseline: 10
      boundary: 3
      malformed: 0
      pcap: 0
      live: 0
  - name: mdns-ci
    purpose: deterministic mDNS pull request coverage for strict-byte, normalized, pcap, and structured-error cases
    default_count: 220
    family_weights:
      - name: mdns
        weight: 1
    payload_length:
      min: 0
      max: 0
    feature_weights:
      baseline: 10
      boundary: 5
      malformed: 1
      pcap: 1
      live: 0
  - name: mdns-boundary
    purpose: focused mDNS QU, cache-flush, known-answer, goodbye, probe, announcement, DNS-SD, compression, and malformed coverage
    default_count: 120
    family_weights:
      - name: mdns
        weight: 1
    payload_length:
      min: 0
      max: 0
    feature_weights:
      baseline: 3
      boundary: 10
      malformed: 4
      pcap: 1
      live: 0
  - name: mdns-pcap
    purpose: focused classic pcap coverage for raw IPv4 and Ethernet-framed mDNS packet shapes
    default_count: 20
    family_weights:
      - name: mdns
        weight: 1
    payload_length:
      min: 0
      max: 0
    feature_weights:
      baseline: 2
      boundary: 2
      malformed: 0
      pcap: 10
      live: 0
  - name: mdns-live-dry-run
    purpose: provider-neutral mDNS live-validation dry-run planning without sending traffic
    default_count: 10
    family_weights:
      - name: mdns
        weight: 1
    payload_length:
      min: 0
      max: 0
    feature_weights:
      baseline: 2
      boundary: 4
      malformed: 0
      pcap: 0
      live: 0

backend_support:
  scapy:
    status: supported
    notes:
      - Profiles sample offline mDNS Scapy packet shapes and fixture-backed malformed payloads.
  libcrafter:
    status: supported
    notes:
      - Profiles remain offline or dry-run and use documentation-safe mDNS fixtures and packet shapes.
