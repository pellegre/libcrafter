version: 1
kind: layer
name: icmpv6
summary: ICMPv6 echo and error messages embedded in IPv6.

roots: []
parents:
  - ipv6
  - ipv6_routing
children:
  - ipv6
  - payload

fields:
  - name: type
    type: uint8
    required: true
    domains:
      - echo_request
      - echo_reply
      - destination_unreachable
      - packet_too_big
      - time_exceeded
      - parameter_problem
    codepoints:
      # Existing RFC 4443 echo/error kinds keep their domains above; the kinds
      # below are scaffolded here for the NDP/MLD/extended-echo coverage that
      # lands in later steps (libcrafter does not emit these wire bytes yet, so
      # no smoke coverage_case references them at this step).
      - value: echo_request
        name: echo_request
        registry: icmpv6-parameters
        source: RFC 4443
        note: existing; type 128
      - value: echo_reply
        name: echo_reply
        registry: icmpv6-parameters
        source: RFC 4443
        note: existing; type 129
      - value: destination_unreachable
        name: destination_unreachable
        registry: icmpv6-parameters
        source: RFC 4443
        note: existing error; type 1
      - value: packet_too_big
        name: packet_too_big
        registry: icmpv6-parameters
        source: RFC 4443
        note: existing error; type 2
      - value: time_exceeded
        name: time_exceeded
        registry: icmpv6-parameters
        source: RFC 4443
        note: existing error; type 3
      - value: parameter_problem
        name: parameter_problem
        registry: icmpv6-parameters
        source: RFC 4443
        note: existing error; type 4
      - value: router_solicitation
        name: router_solicitation
        registry: icmpv6-parameters
        source: RFC 4861
        note: NDP RS; type 133; scaffolded for later steps
      - value: router_advertisement
        name: router_advertisement
        registry: icmpv6-parameters
        source: RFC 4861
        note: NDP RA; type 134; carries ndp_options; scaffolded for later steps
      - value: neighbor_solicitation
        name: neighbor_solicitation
        registry: icmpv6-parameters
        source: RFC 4861
        note: NDP NS; type 135; scaffolded for later steps
      - value: neighbor_advertisement
        name: neighbor_advertisement
        registry: icmpv6-parameters
        source: RFC 4861
        note: NDP NA; type 136; R/S/O flags; scaffolded for later steps
      - value: redirect
        name: redirect
        registry: icmpv6-parameters
        source: RFC 4861
        note: NDP Redirect; type 137; scaffolded for later steps
      - value: mld_query
        name: mld_query
        registry: icmpv6-parameters
        source: RFC 2710, RFC 3810
        note: MLDv1/MLDv2 Multicast Listener Query; type 130; scaffolded
      - value: mld_report
        name: mld_report
        registry: icmpv6-parameters
        source: RFC 2710
        note: MLDv1 Multicast Listener Report; type 131; scaffolded
      - value: mld_done
        name: mld_done
        registry: icmpv6-parameters
        source: RFC 2710
        note: MLDv1 Multicast Listener Done; type 132; scaffolded
      - value: mldv2_report
        name: mldv2_report
        registry: icmpv6-parameters
        source: RFC 3810, RFC 9777
        note: MLDv2 Multicast Listener Report; type 143; scaffolded
      - value: extended_echo_request
        name: extended_echo_request
        registry: icmpv6-parameters
        source: RFC 8335
        note: Extended Echo Request; type 160; scaffolded for later steps
      - value: extended_echo_reply
        name: extended_echo_reply
        registry: icmpv6-parameters
        source: RFC 8335
        note: Extended Echo Reply; type 161; scaffolded for later steps
    unknown:
      raw: true
      note: >-
        Unknown numeric ICMPv6 types decode with the fixed header intact and
        preserve the remaining payload as Raw (see spec.md edge cases). No type
        value is rejected or remapped.
    note: >-
      The smoke profile keeps the protocol-correct echo/error domains so the
      existing ipv6-icmp / icmpv6-errors golden cases stay byte-stable. The
      NDP (RFC 4861, types 133-137), MLD (RFC 2710 / RFC 3810, types 130-132 /
      143), and extended-echo (RFC 8335, types 160/161) kinds are scaffolded as
      recognized codepoints here; libcrafter does not yet emit their wire bytes,
      so they gain coverage cases in the per-message steps that follow.
  - name: code
    type: uint8
    required: true
    domains:
      - 0
      - protocol_specific
  - name: checksum
    type: uint16
    required: true
    domains:
      - derived
  - name: identifier
    type: uint16
    required: false
    domains:
      - deterministic
  - name: sequence
    type: uint16
    required: false
    domains:
      - deterministic
  - name: embedded_header
    type: packet_prefix
    required: false
    domains:
      - ipv6
  - name: ndp_options
    type: list
    required: false
    domains:
      - deterministic
    feature: ndp_options
    note: >-
      Ordered list of NDP option TLVs (RFC 4861 §4.6) carried by the NDP
      message kinds (router_solicitation, router_advertisement,
      neighbor_solicitation, neighbor_advertisement, redirect). Each option is
      a 1-octet type, a 1-octet length expressed in units of 8 octets covering
      the whole option (type/length header included, padded to the 8-octet
      boundary), then the option value. Option order is preserved on decode and
      re-encode, and unknown option types are preserved as raw option bytes
      rather than rejected or remapped. The option-family detail (per-option
      types, length-unit semantics, auto-fill, and unknown preservation) is
      modeled in the ndp_options feature spec. This field is scaffolding:
      libcrafter does not yet emit NDP option wire bytes, so no smoke
      coverage_case references it at this step.

coverage_cases:
  - ipv6-icmp
  - ipv6-routing-icmpv6
  - icmpv6-errors
  - crafter-icmpv6-errors
  # RFC 4861 Neighbor Discovery core messages (types 133-137) plus the base
  # options carried by each (SLLA/TLLA opt 1/2, Prefix Information opt 3,
  # Redirected Header opt 4, MTU opt 5). Both interop directions are covered in
  # tools/oracle/specs/fixtures/scapy-cases.json against the scapy ICMPv6ND_*
  # / ICMPv6NDOpt* reference; the primary round-trip correctness gate is the
  # Rust integration test crafter/tests/icmpv6_ndp.rs.
  - ndp-router-solicitation
  - ndp-router-advertisement
  - ndp-neighbor-solicitation
  - ndp-neighbor-advertisement
  - ndp-redirect
  - crafter-ndp-router-solicitation
  - crafter-ndp-router-advertisement
  - crafter-ndp-neighbor-solicitation
  - crafter-ndp-neighbor-advertisement
  - crafter-ndp-redirect
  # Router Advertisement carrying the Prefix Information + MTU + RDNSS option
  # trio together (step-33 RA grouping), complementing ndp-router-advertisement
  # (PrefixInfo+MTU) and ndp-ra-route-rdnss-dnssl-mtu (Route+RDNSS+DNSSL+MTU).
  # Both directions byte-proved against the scapy ICMPv6NDOpt* reference.
  - ndp-ra-prefix-mtu-rdnss
  - crafter-ndp-ra-prefix-mtu-rdnss
  # Standards-track NDP option extensions: Route Information (RFC 4191), RDNSS
  # and DNSSL (RFC 8106), MTU (RFC 4861), PREF64 (RFC 8781), Captive Portal
  # (RFC 8910), and unknown-option preservation (RFC 4861 section 4.6). Byte
  # agreement with the scapy ICMPv6NDOpt* reference is proved in
  # tools/oracle/specs/fixtures/scapy-cases.json; the Nonce (RFC 3971) and RA
  # Flags Extension (RFC 5175) options have no native scapy class and are noted
  # as a documented limitation there. The primary correctness gate is the Rust
  # integration test crafter/tests/icmpv6_ndp.rs.
  - ndp-ra-route-rdnss-dnssl-mtu
  - ndp-pref64
  - ndp-captive-portal
  - ndp-unknown-option
  - crafter-ndp-ra-route-rdnss-dnssl-mtu
  - crafter-ndp-pref64
  - crafter-ndp-captive-portal
  - crafter-ndp-unknown-option
  # Multicast Listener Discovery: MLDv1 (RFC 2710, types 130-132) and MLDv2
  # (RFC 3810 / RFC 9777, type 143 report + the type-130 v2 query). Scapy 2.7
  # carries native classes (ICMPv6MLQuery/MLReport/MLDone/MLQuery2/MLReport2/
  # MLDMultAddrRec), so both interop directions are byte-proven in
  # tools/oracle/specs/fixtures/scapy-cases.json. The primary correctness gate
  # is the Rust integration test crafter/tests/icmpv6_ndp.rs.
  - mldv1-general-query
  - mldv1-report
  - mldv1-done
  - mldv2-report-two-records
  - mldv2-general-query
  - crafter-mldv1-general-query
  - crafter-mldv1-report
  - crafter-mldv1-done
  - crafter-mldv2-report-two-records
  - crafter-mldv2-general-query
  # ICMPv6 Extended Echo (RFC 8335, types 160/161) and Node Information
  # (RFC 4620, type 139, experimental). DOCUMENTED LIMITATION: scapy 2.5+/2.7
  # has no native ICMPv6 extended-echo class, and libcrafter keeps the Node
  # Information Data field opaque, so these carry no strict native-class
  # byte-proof; their correctness is gated by the crafter/tests/icmpv6_ndp.rs
  # round-trips and the extended_echo.rs / node_info.rs unit tests instead of
  # failing the suite. Recorded in the case notes.
  - icmpv6-extended-echo-request
  - icmpv6-extended-echo-reply
  - icmpv6-node-information-query

backend_support:
  scapy:
    status: supported
    native_layers:
      - ICMPv6EchoRequest
      - ICMPv6EchoReply
      - ICMPv6DestUnreach
      - ICMPv6PacketTooBig
      - ICMPv6TimeExceeded
      - ICMPv6ParamProblem
      # NDP / MLD scaffolding: Scapy materializes these natively; the backend
      # mapping table (tools/oracle/engine/backends/scapy/packets.py) and
      # normalizer are extended so cases can use them once libcrafter emits the
      # bytes in later steps.
      - ICMPv6ND_RS
      - ICMPv6ND_RA
      - ICMPv6ND_NS
      - ICMPv6ND_NA
      - ICMPv6ND_Redirect
      - ICMPv6MLQuery
      - ICMPv6MLQuery2
      - ICMPv6MLReport
      - ICMPv6MLDone
      - ICMPv6MLReport2
      - ICMPv6MLDMultAddrRec
      # Base NDP options (RFC 4861); see the ndp_options feature spec.
      - ICMPv6NDOptSrcLLAddr
      - ICMPv6NDOptDstLLAddr
      - ICMPv6NDOptPrefixInfo
      - ICMPv6NDOptMTU
      - ICMPv6NDOptRedirectedHdr
      # Standards-track NDP option extensions with a native Scapy class
      # (RFC 4191 / RFC 8106 / RFC 8781 / RFC 8910). The Nonce (RFC 3971) and RA
      # Flags Extension (RFC 5175) options have NO native Scapy class in scapy
      # 2.5+/2.7, so they materialize as ICMPv6NDOptUnknown; see the notes below
      # and the crafter-ndp-unknown-option case for that documented limitation.
      - ICMPv6NDOptRouteInfo
      - ICMPv6NDOptRDNSS
      - ICMPv6NDOptDNSSL
      - ICMPv6NDOptPREF64
      - ICMPv6NDOptCaptivePortal
      - ICMPv6NDOptUnknown
    encode: true
    decode: true
    notes:
      - Echo and the four RFC 4443 errors materialize and normalize today.
      - >-
        NDP (RFC 4861) and MLD (RFC 2710 / RFC 3810) kinds are scaffolded in the
        backend type-mapping and normalization tables; extended-echo types
        160/161 have no native Scapy ICMPv6 class, so the backend emits the
        numeric type (raw-compatible), mirroring the ICMPv4 extended-echo path.
      - >-
        NDP core messages (types 133-137) and their base options (SLLA/TLLA,
        Prefix Information, Redirected Header, MTU) materialize natively via
        ICMPv6ND_RS/RA/NS/NA/Redirect + ICMPv6NDOptSrcLLAddr/DstLLAddr/PrefixInfo/
        RedirectedHdr/MTU and agree with libcrafter byte-for-byte (the ndp-* and
        crafter-ndp-* coverage cases). One quirk: scapy's ICMPv6ND_RA defaults the
        RFC 4191 Default Router Preference (Prf) field, which occupies two of the
        RFC 4861 send-as-zero Reserved flag bits, to a non-zero value; a strict
        Router Advertisement comparison materializes the reference with prf=0 so
        its flags byte matches libcrafter, which sends those Reserved bits zero
        (an agent sets the RFC 4191 preference through the honored-override
        rest-of-header). See the ndp-router-advertisement case note.
      - >-
        The standards-track NDP option extensions Route Information (RFC 4191),
        RDNSS and DNSSL (RFC 8106), PREF64 (RFC 8781), and Captive Portal
        (RFC 8910) materialize natively via ICMPv6NDOptRouteInfo / RDNSS / DNSSL
        / PREF64 / CaptivePortal and agree with libcrafter byte-for-byte (the
        ndp-ra-route-rdnss-dnssl-mtu, ndp-pref64, ndp-captive-portal cases and
        their crafter-* mirrors; an unknown option type round-trips via
        ICMPv6NDOptUnknown in ndp-unknown-option). DOCUMENTED LIMITATION: scapy
        2.5+/2.7 has no native class for the Nonce option (RFC 3971) or the RA
        Flags Extension option (RFC 5175), so those two options carry no
        native-class byte-proof case; on the wire they are ICMPv6NDOptUnknown
        (type 14 / type 26) and their correctness is gated by the
        crafter/tests/icmpv6_ndp.rs round-trips and the ndp_option.rs unit tests
        instead of failing the suite. One representational note for Route
        Information: scapy's ICMPv6NDOptRouteInfo always emits the full 16 prefix
        octets (RFC 4191 Length 3), so the byte-proof pins libcrafter to the same
        16-octet form (NdpOption::route_information_raw with prefix_octets=16)
        while the Rust round-trip uses the natural length-derived form (a /48
        prefix carries 8 octets, Length 2) — both are RFC 4191 section 2.3 valid.
      - >-
        Multicast Listener Discovery materializes natively: MLDv1 (RFC 2710,
        types 130-132) via ICMPv6MLQuery / ICMPv6MLReport / ICMPv6MLDone and
        MLDv2 (RFC 3810 / RFC 9777, type 143 report + the type-130 v2 query) via
        ICMPv6MLReport2 (with ICMPv6MLDMultAddrRec records) / ICMPv6MLQuery2.
        Each agrees with libcrafter byte-for-byte (the mldv1-general-query,
        mldv1-report, mldv1-done, mldv2-report-two-records, mldv2-general-query
        cases and their crafter-* mirrors, proved by scapy-2.7 materialization
        diff). The MLDv2 query reuses type 130 with the MLDv1 query and is
        selected by body length (the longer flags/QRV/QQIC/source run).
      - >-
        DOCUMENTED LIMITATION: scapy 2.5+/2.7 has NO native ICMPv6 class for the
        RFC 8335 Extended Echo (types 160/161), so the icmpv6-extended-echo-request
        / -reply cases carry no strict native-class byte-proof (they would decode
        as a raw ICMPv6 type 160/161 payload); their correctness is gated by the
        crafter/tests/icmpv6_ndp.rs round-trips and the extended_echo.rs unit
        tests, mirroring the ICMPv4 extended-echo handling. Node Information
        (RFC 4620, type 139, experimental) does have native scapy NIQuery*/NIReply*
        classes, but libcrafter keeps its Data field opaque (the layout is
        Qtype-dependent and the family is experimental), so the
        icmpv6-node-information-query case asserts no strict typed-stack mapping
        and is gated by the node_info.rs unit tests and the
        crafter/tests/icmpv6_ndp.rs node-information round-trips. Both are recorded
        here rather than failing the suite.
  libcrafter:
    status: partial
    encode: true
    decode: true
    notes:
      - ICMPv6 error matrix is planned coverage.
      - >-
        NDP, MLD (MLDv1 + MLDv2), extended echo (RFC 8335, types 160/161), and
        Node Information (RFC 4620, type 139) emission are implemented; libcrafter
        emits these wire bytes and they round-trip through compile() /
        decode_from_l3 (crafter/tests/icmpv6_ndp.rs). The offline/pcap corpus is
        driven from stacks.yaml and does not auto-emit these families, so the
        scapy-cases.json entries are a coverage manifest plus the byte-proof
        (MLD, native scapy classes) or a documented scapy limitation (extended
        echo and Node Information); the Rust round-trips are the executable gate.
