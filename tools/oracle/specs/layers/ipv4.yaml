version: 1
kind: layer
name: ipv4
summary: IPv4 header, DSCP/ECN, fragmentation fields, options, and raw protocol fallback.

roots:
  - "l3:ipv4"
parents:
  - ethernet
  - vlan
  - linux_cooked
  - null_loopback
children:
  - udp
  - tcp
  - icmp
  - dns
  - payload

fields:
  - name: src
    type: ipv4
    required: true
    domains:
      - documentation_ipv4
      - zero
  - name: dst
    type: ipv4
    required: true
    domains:
      - documentation_ipv4
      - broadcast
  - name: ds_field
    type: uint8
    required: true
    domains:
      - 0
      - dscp_ef_ecn_not_ect
      - dscp_cs5_ecn_ect0
      - boundary
    profile_domains:
      ipv4-enrichment:
        - dscp_ef_ecn_not_ect
        - dscp_cs5_ecn_ect0
        - boundary
  - name: dscp
    type: uint6
    required: false
    domains:
      - cs0
      - cs1
      - cs2
      - cs3
      - cs4
      - cs5
      - cs6
      - cs7
      - af11
      - af21
      - af31
      - af41
      - ef
      - voice_admit
      - le
      - nqb
      - boundary
  - name: ecn
    type: uint2
    required: false
    domains:
      - not_ect
      - ect1
      - ect0
      - ce
  - name: header_length
    type: uint4
    required: true
    domains:
      - derived
      - minimum
      - options
      - maximum
  - name: length
    type: uint16
    required: true
    domains:
      - derived
      - header_only
      - with_payload
      - boundary
  - name: ttl
    type: uint8
    required: true
    domains:
      - 1
      - 60
      - 64
      - 255
    profile_domains:
      ipv4-enrichment:
        - 1
        - 255
  - name: protocol
    type: uint8
    required: true
    domains:
      - hop_by_hop
      - icmp
      - tcp
      - udp
      - ipv6
      - gre
      - esp
      - ah
      - icmpv6
      - ospf
      - sctp
      - experimental_1
      - experimental_2
      - unknown
      - reserved
  - name: identification
    type: uint16
    required: true
    domains:
      - deterministic
      - boundary
  - name: flags
    type: flags
    required: true
    domains:
      - none
      - reserved
      - df
      - mf
      - df_mf
      - all
    profile_domains:
      ipv4-enrichment:
        - none
        - df
        - mf
  - name: fragment_offset
    type: uint13
    required: true
    domains:
      - 0
      - 1
      - non_initial
      - boundary
    profile_domains:
      ipv4-enrichment:
        - 0
        - 1
        - boundary
  - name: checksum
    type: uint16
    required: true
    domains:
      - derived
      - explicit
      - explicit_invalid
      - boundary
  - name: options
    type: option_list
    required: false
    domains:
      - eol
      - nop
      - record_route
      - loose_source_route
      - strict_source_route
      - timestamp
      - traceroute
      - router_alert
      - experimental
      - generic
    profile_domains:
      ipv4-enrichment:
        - record_route
        - loose_source_route
        - timestamp
        - traceroute
        - generic

coverage_cases:
  - ipv4-boundary-fields
  - ipv4-unknown-protocol-raw
  - ipv4-fragment-mf-offset
  - ipv4-ttl-255
  - ipv4-options
  - ipv4-options-source-route-traceroute
  - crafter-ipv4-boundary-fields
  - crafter-ipv4-unknown-protocol-raw
  - crafter-ipv4-fragment-mf-offset
  - crafter-ipv4-ttl-255
  - crafter-ipv4-options
  - crafter-ipv4-source-route-traceroute

backend_support:
  scapy:
    status: supported
    native_layers:
      - IP
    encode: true
    decode: true
  libcrafter:
    status: supported
    encode: true
    decode: true
