version: 1
kind: layer
name: dhcp
summary: BOOTP plus DHCP message and option lists over Ethernet IPv4 UDP.

roots: []
parents:
  - udp
children: []

fields:
  - name: op
    type: uint8
    required: true
    domains:
      - bootrequest
      - bootreply
  - name: hops
    type: uint8
    required: false
    domains:
      - zero
  - name: seconds
    type: uint16
    required: false
    domains:
      - zero
  - name: server_ip
    type: ipv4
    required: false
    domains:
      - zero
      - documentation_ipv4
  - name: relay_ip
    type: ipv4
    required: false
    domains:
      - zero
      - documentation_ipv4
  - name: hardware_type
    type: uint8
    required: true
    domains:
      - ethernet
  - name: hardware_length
    type: uint8
    required: true
    domains:
      - 6
  - name: transaction_id
    type: uint32
    required: true
    domains:
      - deterministic
  - name: flags
    type: flags
    required: true
    domains:
      - none
      - broadcast
  - name: client_ip
    type: ipv4
    required: true
    domains:
      - zero
      - documentation_ipv4
  - name: your_ip
    type: ipv4
    required: true
    domains:
      - zero
      - documentation_ipv4
  - name: client_hardware_address
    type: bytes
    required: true
    domains:
      - documentation_mac_padded
  - name: options
    type: dhcp_option_list
    required: true
    domains:
      - message_type
      - hostname
      - domain_name
      - requested_ip
      - server_id
      - parameter_request_list
      - lease_time
      - router
      - dns_server
      - vendor_class
      - client_identifier
      - classless_static_route
      - relay_agent
      - generic
      - end

coverage_cases:
  - dhcp-discover
  - dhcp-request-offer-ack
  - dhcp-inform-release-generic-options
  - crafter-dhcp-message-matrix

notes:
  - The fixed BOOTP fields hops, seconds, server_ip (siaddr), and relay_ip
    (giaddr) are part of the decoded/normalized DHCPv4 surface. The seeded
    Scapy/libcrafter offline path keeps them at their protocol-correct defaults
    so cross-backend bytes stay identical; native Rust fixtures in
    tools/oracle/adapters exercise non-default values.
  - Scapy-byte-safe option domains (message_type, hostname, domain_name,
    requested_ip, server_id, parameter_request_list, lease_time, router,
    dns_server, vendor_class, client_identifier, classless_static_route, and
    raw relay_agent option 82) round-trip strict-bytes through both backends.
  - Scapy cannot represent option overload (52 across file/sname), RFC 3396
    long-option concatenation, typed relay sub-option registries, RFC 4361
    node-specific client identifiers, RFC 3118 authentication (90), or the
    leasequery time/status/state options (91/92/151-157) byte-for-byte. Those
    DHCPv4 cases are covered offline by native libcrafter round-trip fixtures
    under tools/oracle/adapters/src/bin/materialize_plans.rs instead of the
    Scapy reference backend. See features/dhcp-behavior.yaml notes.

backend_support:
  scapy:
    status: supported
    native_layers:
      - BOOTP
      - DHCP
    encode: true
    decode: true
  libcrafter:
    status: partial
    encode: true
    decode: true
    notes:
      - Full message matrix and generic options are planned coverage.
