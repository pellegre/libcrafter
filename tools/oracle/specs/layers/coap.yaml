version: 1
kind: layer
name: coap
summary: >-
  CoAP datagrams and one complete reliable-transport frame, with lossless
  header, token, ordered option, payload-marker, payload, signaling, and
  protected-message metadata. Transaction state, stream reassembly, TLS/DTLS,
  discovery scans, and live endpoint selection remain outside the layer.

roots: []
parents:
  - udp
  - tcp
children: []

supported_parents:
  - layer: udp
    destination_port: 5683
    service: coap
  - layer: udp
    source_port: 5683
    service: coap
  - layer: tcp
    destination_port: 5683
    service: coap
  - layer: tcp
    source_port: 5683
    service: coap
secure_raw_parents:
  - layer: udp
    port: 5684
    service: coaps
    policy: opaque_raw
  - layer: tcp
    port: 5684
    service: coaps
    policy: opaque_raw
fields:
  - name: transport
    type: enum
    required: true
    domains: [datagram, reliable]
  - name: version
    type: uint2
    required: false
    domains: [canonical, explicit_preserved, reserved_preserved]
  - name: message_type
    type: uint2
    required: false
    domains: [confirmable, non_confirmable, acknowledgement, reset]
  - name: code
    type: uint8
    required: true
    domains: [request, response, signaling, unknown_preserved]
  - name: message_id
    type: uint16
    required: false
    domains: [deterministic, boundary, explicit_preserved]
  - name: token
    type: bytes
    required: false
    domains: [empty, base, extended8, extended16, maximum]
  - name: token_length
    type: coap_token_length
    required: false
    domains: [derived, direct, extended8, extended16, explicit_preserved]
  - name: reliable_length
    type: coap_reliable_length
    required: false
    domains: [derived, direct, extended8, extended16, extended32, explicit_preserved]
  - name: options
    type: coap_option_list
    required: false
    domains: [empty, uri, representation, observe, blockwise, qblock, oscore, unknown_preserved]
  - name: payload_marker
    type: enum
    required: false
    domains: [absent, present, explicit_missing, explicit_empty]
  - name: payload
    type: bytes
    required: false
    domains: [empty, text, binary, link_format, protected_opaque]
  - name: signaling_options
    type: coap_signaling_option_list
    required: false
    domains: [empty, csm, ping_pong, release, abort, unknown_preserved]

normalized_fields:
  datagram: [version, message_type, token_length, code, message_id, token, options, payload_marker, payload]
  reliable: [reliable_length, token_length, code, token, options, payload_marker, payload]
  option: [number, delta, length, value, order, raw_header]
  protected: [outer_code, token, oscore_option, ciphertext, tag_length, plaintext_exposed]

coverage_cases:
  - coap-datagram-get
  - coap-datagram-content
  - coap-options-payload
  - coap-reliable-csm
  - coap-observe-notification
  - coap-block2
  - coap-qblock2
  - coap-extended-token-extended16
  - coap-link-format-canonical
  - coap-oscore-request-vector
  - coap-secure-port-raw
  - malformed-coap-truncated-header
  - coap-pcap-raw-ipv4
  - coap-pcap-raw-ipv6
  - coap-pcap-ethernet-ipv4

backend_support:
  scapy:
    status: partial
    encode: true
    decode: true
    native_layers: [CoAP, Raw]
    notes:
      - Native Scapy agreement is limited to authoritative RFC 7252 base datagrams; the protocol-local raw builder preserves other bytes without claiming independent agreement.
      - Reliable framing, extended tokens, incomplete advanced-option typing, and OSCORE transforms are explicit capability gaps.
  wireshark:
    status: partial
    decode: true
    native_layers: [coap]
    notes:
      - Parser-only cleartext datagram normalization prefers source bytes and never requires TLS/DTLS or OSCORE secrets.
      - Reliable stream framing, version-dependent extended-token presentation, and secret-assisted OSCORE remain explicit gaps.
  libcrafter:
    status: supported
    encode: true
    decode: true
    pcap_read: true
    pcap_write: true
    native_layers: [Coap, CoapReliable]
    notes:
      - The crate supports typed datagram and one-frame reliable CoAP, advanced options, link-format, OSCORE vectors, structured errors, and classic pcap fixtures offline.
