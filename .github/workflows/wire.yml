name: wire-endpoints

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      confirm_hetzner_live:
        description: "Type run to create Hetzner wire endpoints and exchange packets."
        required: true
        default: "no"
      oracle_live_profile:
        description: "Oracle profile for Hetzner wire dry-run and real exchange."
        required: true
        default: "smoke"
      oracle_live_seed:
        description: "Oracle deterministic seed."
        required: true
        default: "1"
      oracle_live_count:
        description: "Oracle packet plan count."
        required: true
        default: "2"
      probe_live_profile:
        description: "Probe profile for Hetzner wire dry-run and real exchange."
        required: true
        default: "smoke"
      probe_live_seed:
        description: "Probe deterministic seed."
        required: true
        default: "21"
      probe_live_count:
        description: "Probe case count."
        required: true
        default: "25"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dry-run:
    name: Hetzner wire endpoint dry runs
    runs-on: ubuntu-latest
    env:
      ORACLE_LIVE_PROFILE: ${{ github.event.inputs.oracle_live_profile || 'smoke' }}
      ORACLE_LIVE_SEED: ${{ github.event.inputs.oracle_live_seed || '1' }}
      ORACLE_LIVE_COUNT: ${{ github.event.inputs.oracle_live_count || '2' }}
      PROBE_LIVE_PROFILE: ${{ github.event.inputs.probe_live_profile || 'smoke' }}
      PROBE_LIVE_SEED: ${{ github.event.inputs.probe_live_seed || '21' }}
      PROBE_LIVE_COUNT: ${{ github.event.inputs.probe_live_count || '25' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install oracle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl python3

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run oracle Hetzner wire dry run
        run: |
          tools/oracle/run live --provider hetzner --dry-run \
            --profile "$ORACLE_LIVE_PROFILE" \
            --seed "$ORACLE_LIVE_SEED" \
            --count "$ORACLE_LIVE_COUNT"

      - name: Run oracle DHCP IPv4 live dry run
        run: |
          tools/oracle/run live --backend scapy --provider hetzner --dry-run \
            --profile smoke \
            --seed 133 \
            --count 2 \
            --case dhcp-discover \
            --out target/oracle/dhcp-hetzner-dry-run

      - name: Run probe Hetzner wire dry run
        run: |
          tools/probe/run --provider hetzner --dry-run \
            --profile "$PROBE_LIVE_PROFILE" \
            --seed "$PROBE_LIVE_SEED" \
            --count "$PROBE_LIVE_COUNT"

      - name: Upload wire dry-run artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: libcrafter-wire-dry-run-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            target/oracle/live
            target/oracle/dhcp-hetzner-dry-run
            target/probe

  hetzner-live:
    name: protected Hetzner wire endpoint exchange
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_hetzner_live == 'run' }}
    environment: hetzner-live
    timeout-minutes: 90
    concurrency:
      group: hetzner-wire-endpoints
      cancel-in-progress: false
    env:
      CONFIRM_HETZNER_LIVE: ${{ github.event.inputs.confirm_hetzner_live }}
      HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
      ORACLE_LIVE_PROFILE: ${{ github.event.inputs.oracle_live_profile }}
      ORACLE_LIVE_SEED: ${{ github.event.inputs.oracle_live_seed }}
      ORACLE_LIVE_COUNT: ${{ github.event.inputs.oracle_live_count }}
      PROBE_LIVE_PROFILE: ${{ github.event.inputs.probe_live_profile }}
      PROBE_LIVE_SEED: ${{ github.event.inputs.probe_live_seed }}
      PROBE_LIVE_COUNT: ${{ github.event.inputs.probe_live_count }}
      LIBCRAFTER_WIRE_ARTIFACT_ROOT: ${{ github.workspace }}/target/wire-artifacts
      LIBCRAFTER_WIRE_STATE_ROOT: ${{ github.workspace }}/target/wire-state

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate protected inputs
        run: |
          if [ "${CONFIRM_HETZNER_LIVE}" != "run" ]; then
            echo "::error::Set confirm_hetzner_live=run to create Hetzner resources."
            exit 78
          fi
          if [ -z "${HETZNER_API_TOKEN:-}" ]; then
            echo "::error::HETZNER_API_TOKEN secret is required for real Hetzner wire endpoint exchange."
            exit 78
          fi

      - name: Install oracle and provider dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq openssh-client python3 tar

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run real Hetzner oracle wire exchange
        run: |
          tools/oracle/run live --provider hetzner \
            --confirm-live-run \
            --profile "$ORACLE_LIVE_PROFILE" \
            --seed "$ORACLE_LIVE_SEED" \
            --count "$ORACLE_LIVE_COUNT"

      - name: Run real Hetzner DHCP IPv4 oracle exchange
        run: |
          tools/oracle/run live --backend scapy --provider hetzner \
            --confirm-live-run \
            --profile smoke \
            --seed 133 \
            --count 2 \
            --case dhcp-discover \
            --out target/oracle/dhcp-hetzner-live

      - name: Run real Hetzner probe exchange
        run: |
          tools/probe/run --provider hetzner \
            --confirm-live-run \
            --profile "$PROBE_LIVE_PROFILE" \
            --seed "$PROBE_LIVE_SEED" \
            --count "$PROBE_LIVE_COUNT"

      - name: Collect remaining wire artifacts
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          result = subprocess.run(
              ["tools/wire/run", "list-endpoints", "--json"],
              check=False,
              stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,
              text=True,
          )
          if result.returncode != 0:
              raise SystemExit(0)
          for endpoint in json.loads(result.stdout or "{}").get("endpoints", []):
              endpoint_id = endpoint.get("endpoint_id")
              if endpoint_id:
                  subprocess.run(
                      ["tools/wire/run", "collect-artifacts", endpoint_id],
                      check=False,
                  )
          PY

      - name: Destroy remaining wire resources
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          result = subprocess.run(
              ["tools/wire/run", "list-endpoints", "--json"],
              check=False,
              stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,
              text=True,
          )
          if result.returncode != 0:
              raise SystemExit(0)
          for endpoint in reversed(json.loads(result.stdout or "{}").get("endpoints", [])):
              endpoint_id = endpoint.get("endpoint_id")
              if endpoint_id:
                  subprocess.run(
                      ["tools/wire/run", "destroy-endpoint", endpoint_id, "--json"],
                      check=False,
                  )
          PY

      - name: Upload wire artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: libcrafter-wire-hetzner-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            target/oracle/live
            target/oracle/dhcp-hetzner-live
            target/probe
            target/wire-artifacts
