name: local-static

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  static:
    name: rust static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap-dev pkg-config python3-pip python3-venv

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run pcap roundtrip tests
        run: |
          cargo test -p crafter-pcap pcap_read
          cargo test -p crafter-pcap pcap_write
          cargo test -p crafter-pcap pcap_roundtrip

      - name: Build examples
        run: cargo build --examples

      - name: Check Scapy fixture generation
        run: |
          fixtures=(
            arp-request
            dns-query
            ethernet
            ipv4-icmp
            ipv6-icmp
            vlan-ipv4-udp
          )
          out_dir="$(mktemp -d)"
          args=(--out "$out_dir")
          for fixture in "${fixtures[@]}"; do
            args+=(--only "$fixture")
          done
          tools/reference/generate-scapy-fixtures "${args[@]}"
          for fixture in "${fixtures[@]}"; do
            cmp "tests/fixtures/scapy/$fixture.bin" "$out_dir/$fixture.bin"
            python3 -m json.tool "$out_dir/$fixture.json" >/dev/null
          done

      - name: Run Scapy interop checks
        run: |
          tools/reference/check-scapy-interop
          tools/reference/check-scapy-interop --family pcap
