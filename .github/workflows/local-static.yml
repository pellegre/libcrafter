name: local-static

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  static:
    name: rust static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl libpcap-dev pkg-config python3

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run pcap roundtrip tests
        run: |
          cargo test -p crafter pcap_read
          cargo test -p crafter pcap_write
          cargo test -p crafter pcap_roundtrip

      - name: Check reference backend naming boundary
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          blocked = ("sca" + "py",)
          hits = []

          tracked = subprocess.check_output(
              ["git", "ls-files"],
              text=True,
          ).splitlines()
          for name in tracked:
              path = Path(name)
              if path.parts[:2] == ("tools", "oracle"):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              lowered = text.lower()
              for term in blocked:
                  if term in lowered:
                      hits.append(str(path))
                      break

          if hits:
              print("reference backend names must stay under tools/oracle/:")
              for hit in hits:
                  print(hit)
              raise SystemExit(1)
          PY

      - name: Build examples
        run: cargo build --examples

      - name: Check Python test layout
        run: |
          set -euo pipefail
          misplaced_engine_tests="$(find tools -path '*/engine/*' -type f -name 'test_*.py' -print)"
          misplaced_test_code="$(find tools -path '*/tests/*' -type f -name '*.py' ! -name 'test_*.py' ! -name '__init__.py' -print)"

          if [[ -n "$misplaced_engine_tests$misplaced_test_code" ]]; then
            if [[ -n "$misplaced_engine_tests" ]]; then
              echo "test files must live under tools/*/tests, not engine:"
              printf '%s\n' "$misplaced_engine_tests"
            fi
            if [[ -n "$misplaced_test_code" ]]; then
              echo "non-test Python code must not live under tools/*/tests:"
              printf '%s\n' "$misplaced_test_code"
            fi
            exit 1
          fi

      - name: Compile Python validation tooling
        run: python3 -m compileall tools/oracle/engine tools/probe/engine tools/wire/engine tools/wire/smoke

      - name: Run oracle Python tests
        run: python3 -m unittest discover -s tools/oracle/tests -p 'test_*.py'

      - name: Run wire Python tests
        run: python3 -m unittest discover -s tools/wire/tests -p 'test_*.py'

      - name: Generate oracle CI corpus
        run: tools/oracle/run corpus --profile ci --seed 12345 --count 100 --out target/oracle/ci-corpus

      - name: Run oracle offline validation
        run: tools/oracle/run offline --corpus target/oracle/ci-corpus/plans.json --out target/oracle/ci-offline

      - name: Run oracle pcap validation
        run: tools/oracle/run pcap --corpus target/oracle/ci-corpus/plans.json --out target/oracle/ci-pcap

      - name: Run oracle Hetzner wire dry run
        run: tools/oracle/run live --provider hetzner --dry-run --corpus target/oracle/ci-corpus/plans.json --out target/oracle/ci-live-dry-run

      - name: Run probe Hetzner dry run
        run: tools/probe/run --provider hetzner --dry-run --profile smoke --seed 1 --count 10 --out target/probe/ci-dry-run
