name: local-static

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  static:
    name: rust static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap-dev pkg-config python3-pip python3-venv

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run pcap roundtrip tests
        run: |
          cargo test -p crafter-pcap pcap_read
          cargo test -p crafter-pcap pcap_write
          cargo test -p crafter-pcap pcap_roundtrip

      - name: Build examples
        run: cargo build --examples

      - name: Check reference fixture generation
        run: tools/reference/check-reference-fixtures

      - name: Run reference interop checks
        run: |
          tools/reference/check-reference-interop
          tools/reference/check-reference-interop --family pcap

      - name: Run oracle offline validation
        run: tools/oracle/run offline --backend scapy --profile ci --seed 12345 --count 2000

      - name: Run oracle pcap smoke validation
        run: tools/oracle/run pcap --backend scapy --profile smoke --seed 12345 --count 250
