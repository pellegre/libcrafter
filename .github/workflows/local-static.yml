name: local-static

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  static:
    name: rust static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl libpcap-dev pkg-config python3

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run pcap roundtrip tests
        run: |
          cargo test -p crafter pcap_read
          cargo test -p crafter pcap_write
          cargo test -p crafter pcap_roundtrip

      - name: Check reference backend naming boundary
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          blocked = ("sca" + "py", "wire" + "shark", "t" + "shark")
          skip_dirs = {".git", ".internal workflow", ".scratch", "target", "tools"}
          hits = []

          for root, dirs, files in os.walk("."):
              dirs[:] = [name for name in dirs if name not in skip_dirs]
              for filename in files:
                  path = Path(root, filename)
                  try:
                      text = path.read_text(encoding="utf-8")
                  except (OSError, UnicodeDecodeError):
                      continue
                  lowered = text.lower()
                  for term in blocked:
                      if term in lowered:
                          hits.append(str(path))
                          break

          if hits:
              print("reference backend names must stay under tools/:")
              for hit in hits:
                  print(hit)
              raise SystemExit(1)
          PY

      - name: Build examples
        run: cargo build --examples

      - name: Run oracle offline validation
        run: tools/oracle/run offline --profile ci --seed 12345 --count 2000

      - name: Run oracle pcap smoke validation
        run: tools/oracle/run pcap --profile smoke --seed 12345 --count 250
