name: live-lab

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      confirm_live_lab:
        description: "Type run to create disposable live-lab infrastructure."
        required: true
        default: "no"
      provider:
        description: "Live-lab provider executable under tools/live-lab/providers."
        required: true
        default: "hetzner"
      suite:
        description: "Live-lab suite to run."
        required: true
        default: "all"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dry-run:
    name: provider dry run
    runs-on: ubuntu-latest
    env:
      LIBCRAFTER_LIVE_LAB_ARTIFACT_DIR: ${{ github.workspace }}/target/live-lab-artifacts
      LIBCRAFTER_LIVE_LAB_STATE_DIR: ${{ runner.temp }}/libcrafter-live-state

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install provider tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq openssh-client tar

      - name: Run provider dry runs
        run: |
          tools/live-lab/libcrafter-live-lab doctor --provider hetzner --dry-run
          tools/live-lab/libcrafter-live-lab create --provider hetzner --dry-run

  live:
    name: disposable live lab
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 90
    env:
      CONFIRM_LIVE_LAB: ${{ github.event.inputs.confirm_live_lab }}
      LIVE_LAB_PROVIDER: ${{ github.event.inputs.provider }}
      LIVE_LAB_SUITE: ${{ github.event.inputs.suite }}
      HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
      LIBCRAFTER_LIVE_LAB_ARTIFACT_DIR: ${{ github.workspace }}/target/live-lab-artifacts
      LIBCRAFTER_LIVE_LAB_STATE_DIR: ${{ runner.temp }}/libcrafter-live-state

    steps:
      - name: Checkout
        if: ${{ env.CONFIRM_LIVE_LAB == 'run' }}
        uses: actions/checkout@v4

      - name: Check confirmation
        run: |
          if [ "${CONFIRM_LIVE_LAB}" = "run" ]; then
            echo "confirmed=true"
          else
            echo "confirmed=false"
            echo "Set confirm_live_lab=run to create disposable infrastructure."
          fi

      - name: Install provider tools
        if: ${{ env.CONFIRM_LIVE_LAB == 'run' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq openssh-client tar

      - name: Require provider secret
        if: ${{ env.CONFIRM_LIVE_LAB == 'run' }}
        run: |
          case "$LIVE_LAB_PROVIDER" in
            hetzner)
              if [ -z "${HETZNER_API_TOKEN:-}" ]; then
                echo "::error::HETZNER_API_TOKEN secret is required for the Hetzner live lab."
                exit 78
              fi
              ;;
            *)
              echo "provider=$LIVE_LAB_PROVIDER"
              ;;
          esac

      - name: Run live-lab suite
        if: ${{ env.CONFIRM_LIVE_LAB == 'run' }}
        run: |
          tools/live-lab/libcrafter-live-lab run \
            --provider "$LIVE_LAB_PROVIDER" \
            --suite "$LIVE_LAB_SUITE"

      - name: Destroy live-lab resources
        if: ${{ always() && env.CONFIRM_LIVE_LAB == 'run' }}
        run: |
          tools/live-lab/libcrafter-live-lab destroy \
            --provider "$LIVE_LAB_PROVIDER" || true

      - name: Upload live-lab artifacts
        if: ${{ always() && env.CONFIRM_LIVE_LAB == 'run' }}
        uses: actions/upload-artifact@v4
        with:
          name: libcrafter-live-lab-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            target/live-lab-artifacts
