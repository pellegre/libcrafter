name: live-lab

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      confirm_hetzner_live:
        description: "Type run to create Hetzner resources and exchange live packets."
        required: true
        default: "no"
      oracle_live_profile:
        description: "Oracle live profile for Hetzner dry-run and real exchange."
        required: true
        default: "smoke"
      oracle_live_seed:
        description: "Oracle live deterministic seed."
        required: true
        default: "1"
      oracle_live_count:
        description: "Oracle live packet plan count."
        required: true
        default: "2"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dry-run:
    name: oracle Hetzner live dry run
    runs-on: ubuntu-latest
    env:
      ORACLE_LIVE_PROFILE: ${{ github.event.inputs.oracle_live_profile || 'smoke' }}
      ORACLE_LIVE_SEED: ${{ github.event.inputs.oracle_live_seed || '1' }}
      ORACLE_LIVE_COUNT: ${{ github.event.inputs.oracle_live_count || '2' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install oracle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl python3

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run oracle Hetzner live dry run
        run: |
          tools/oracle/run live --provider hetzner --dry-run \
            --profile "$ORACLE_LIVE_PROFILE" \
            --seed "$ORACLE_LIVE_SEED" \
            --count "$ORACLE_LIVE_COUNT"

      - name: Upload oracle live dry-run artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: libcrafter-oracle-live-dry-run-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            target/oracle/live

  hetzner-live:
    name: protected Hetzner oracle live exchange
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_hetzner_live == 'run' }}
    environment: hetzner-live
    timeout-minutes: 90
    concurrency:
      group: hetzner-oracle-live
      cancel-in-progress: false
    env:
      CONFIRM_HETZNER_LIVE: ${{ github.event.inputs.confirm_hetzner_live }}
      HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
      ORACLE_LIVE_PROFILE: ${{ github.event.inputs.oracle_live_profile }}
      ORACLE_LIVE_SEED: ${{ github.event.inputs.oracle_live_seed }}
      ORACLE_LIVE_COUNT: ${{ github.event.inputs.oracle_live_count }}
      LIBCRAFTER_LIVE_LAB_ARTIFACT_DIR: ${{ github.workspace }}/target/live-lab-artifacts
      LIBCRAFTER_LIVE_LAB_STATE_DIR: ${{ github.workspace }}/target/live-lab-state

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate protected inputs
        run: |
          if [ "${CONFIRM_HETZNER_LIVE}" != "run" ]; then
            echo "::error::Set confirm_hetzner_live=run to create Hetzner resources."
            exit 78
          fi
          if [ -z "${HETZNER_API_TOKEN:-}" ]; then
            echo "::error::HETZNER_API_TOKEN secret is required for real Hetzner live exchange."
            exit 78
          fi

      - name: Install oracle and provider dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq openssh-client python3 tar

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run real Hetzner oracle live exchange
        run: |
          tools/oracle/run live --provider hetzner \
            --profile "$ORACLE_LIVE_PROFILE" \
            --seed "$ORACLE_LIVE_SEED" \
            --count "$ORACLE_LIVE_COUNT"

      - name: Upload oracle live artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: libcrafter-oracle-live-hetzner-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            target/oracle/live
            target/live-lab-artifacts
