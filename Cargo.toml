[workspace]
members = [
    "crates/crafter-core",
    "crates/crafter-pcap",
    "crates/crafter-net",
    "crates/crafter-live",
    "crates/crafter",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.78"
description = "Rust packet crafting, decoding, pcap, and live-lab tooling."
license = "MIT"
repository = "https://github.com/pellegre/libcrafter"
homepage = "https://github.com/pellegre/libcrafter"
documentation = "https://docs.rs/crafter"
readme = "README.md"
keywords = ["packets", "pcap", "networking", "scapy", "testing"]
categories = ["network-programming", "development-tools"]
